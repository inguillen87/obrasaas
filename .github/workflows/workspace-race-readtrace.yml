# Real diagnostic Git source only; public Own76 metadata is intentionally not validated.
name: Workspace portfolio race native read trace - diagnostic only
on:
  push:
    branches: ['operations/workspace-race-readtrace-20261025']
    paths:
      - '.github/workflows/workspace-race-readtrace.yml'
      - '.github/scripts/workspace-race-readtrace-driver.mjs'
      - '.github/probes/workspace-race-readtrace-binding.json'
permissions:
  contents: read
concurrency:
  group: workspace-race-readtrace-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  diagnostic:
    if: github.repository == 'inguillen87/obrasaas' && github.event_name == 'push' && github.ref == 'refs/heads/operations/workspace-race-readtrace-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: docker.io/library/postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: cutover_test
          POSTGRES_PASSWORD: cutover_test
          POSTGRES_DB: obrasaas_cutover_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U cutover_test -d obrasaas_cutover_ci" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CUTOVER_TEST_DISPOSABLE: '1'
      CUTOVER_TEST_DATABASE_URL: postgresql://cutover_test:cutover_test@127.0.0.1:5432/obrasaas_cutover_ci
      DATABASE_URL: postgresql://build_only:build_only@127.0.0.1:5432/build_only
      SOURCE_SHA: 64a9de0310a1d964cd077f1992e07533a076ab85
      WORKSPACE_UI_SCENARIO: portfolio-access-race
      OPS_ROOT: ${{ github.workspace }}/ops
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: ${{ github.sha }}
          path: ops
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
          ref: 64a9de0310a1d964cd077f1992e07533a076ab85
          path: source
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Original pinned Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Real diagnostic Git source and isolated Operations fences
        run: node ../ops/.github/scripts/workspace-race-readtrace-driver.mjs preflight
      - name: Original portfolio-access-race selector and unchanged assertions
        run: node scripts/verify-workspace-ui.mjs
      - name: Preserve exact source and Operations bytes even after fixture failure
        if: always()
        run: node ../ops/.github/scripts/workspace-race-readtrace-driver.mjs final
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: workspace-race-readtrace-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ops/.vercel/workspace-race-readtrace/
            source/.vercel/workspace-evidence/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
