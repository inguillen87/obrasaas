name: ObraSaaS - comprobar acceso de release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: obrasaas-vercel-release-access
  cancel-in-progress: false
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Comprobar destino sin modificarlo
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/vercel-release-access.mjs
      - name: Conservar solamente el resultado filtrado
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: vercel-release-access-${{ github.run_id }}
          path: evidence/vercel-release-access.json
          retention-days: 1
          if-no-files-found: warn
