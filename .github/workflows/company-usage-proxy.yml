name: Company usage verified route regression
on:
  push:
    branches: [master, 'fix/company-usage-verified-route-*']
    paths:
      - 'src/proxy.js'
      - 'src/app/api/identity/company-usage/route.js'
      - 'src/lib/**'
      - 'tests/production-company-usage-proxy.test.mjs'
      - 'tests/production-access-boundary.test.mjs'
      - 'tests/production-verified-session.test.mjs'
      - 'tests/production-organization-usage.test.mjs'
      - 'tests/fixtures/plan-import-ooxml-synthetic.mjs'
      - 'public/sw.js'
      - 'src/app/access-notice.js'
      - 'src/app/(identity)/**'
      - 'eslint.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/company-usage-proxy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Bind actual source bytes before synthetic execution
        run: |
          mkdir -p .vercel/private/company-usage-proxy-ci
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {readFileSync,writeFileSync,existsSync,readdirSync} from 'node:fs';
          import path from 'node:path';
          import {parse} from '@babel/parser';
          import {verifyPlanBudgetCurrentSources,planBudgetValidationFiles} from './scripts/lib/plan-budget-current-ci-lineage.mjs';
          const git=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const hash=bytes=>createHash('sha256').update(bytes).digest('hex');
          assert.equal(git('rev-parse','HEAD'),process.env.GITHUB_SHA);
          assert.equal(git('status','--porcelain'),'');
          const roots=['src/proxy.js','src/app/api/identity/company-usage/route.js','tests/production-company-usage-proxy.test.mjs','tests/production-access-boundary.test.mjs','tests/production-verified-session.test.mjs','tests/production-organization-usage.test.mjs','public/sw.js','src/app/access-notice.js','src/app/(identity)/sign-in/[[...sign-in]]/page.js','src/app/(identity)/sign-up/[[...sign-up]]/page.js','eslint.config.mjs'];
          const files=new Set(['package.json','package-lock.json','.github/workflows/company-usage-proxy.yml']);
          function visit(file){
            assert.ok(/^(src|tests|public)\//.test(file)||file==='eslint.config.mjs');
            assert.ok(!file.split('/').includes('..'));
            if(files.has(file))return;
            const bytes=readFileSync(file);files.add(file);
            if(!/\.(mjs|js)$/.test(file))return;
            const ast=parse(bytes.toString('utf8'),{sourceType:'unambiguous',plugins:['jsx'],createImportExpressions:true}),imports=[];
            function walk(node){if(!node||typeof node!=='object')return;if(['ImportDeclaration','ExportNamedDeclaration','ExportAllDeclaration'].includes(node.type)&&node.source?.value)imports.push(node.source.value);if(node.type==='ImportExpression'&&node.source?.type==='StringLiteral')imports.push(node.source.value);for(const value of Object.values(node))if(Array.isArray(value))value.forEach(walk);else if(value&&typeof value==='object')walk(value);}
            walk(ast.program);
            for(const ref of imports.filter(value=>value.startsWith('.'))){const base=path.posix.normalize(path.posix.join(path.posix.dirname(file),ref));const resolved=[base,base+'.mjs',base+'.js',base+'/index.mjs',base+'/index.js'].find(value=>existsSync(value));assert.ok(resolved,'Every relative import must resolve');visit(resolved);}
          }
          roots.forEach(visit);
          const sourceManifest=[...files].sort().map(file=>{const committed=execFileSync('git',['show','HEAD:'+file]);assert.deepEqual(readFileSync(file),committed);return {path:file,sha256:hash(committed)};});
          // Authenticate the current Budget companion before its one explicit projection.
          // sourceManifest stays the complete raw current AST closure, including Budget.
          const committedCache=new Map(),readCommitted=file=>{assert.ok(typeof file==='string'&&path.posix.normalize(file)===file&&!path.posix.isAbsolute(file)&&!/[\\:\x00-\x1f]/.test(file)&&!file.split('/').includes('..'));if(!committedCache.has(file))committedCache.set(file,execFileSync('git',['show','HEAD:'+file],{maxBuffer:16*1024*1024}));return committedCache.get(file);};
          const currentContract=JSON.parse(readCommitted('.github/workspace-acceptance-contract.json'));
          function projectCompanyUsageSources(manifest,contract,readSource){
            const authenticated=verifyPlanBudgetCurrentSources(contract,readSource),budgetPath='src/lib/plan-budget-source.mjs',paths=manifest.map(ref=>ref.path);
            assert.deepEqual(paths,[...new Set(paths)].sort(),'The complete actual source paths must be unique and ordered');
            const delta=contract.planBudgetCurrentRevision.sourceSetDeltas.find(row=>row.family==='UNIT');assert.deepEqual(delta?.additions,[budgetPath],'Only the authenticated Budget source addition may be projected');
            assert.ok(paths.includes(budgetPath),'The current Budget source is required before historical projection');
            for(const ref of manifest){assert.deepEqual(Object.keys(ref).sort(),['path','sha256']);assert.equal(ref.sha256,hash(readSource(ref.path)),'Actual source hash must match its complete raw committed bytes');}
            const historical=manifest.filter(ref=>ref.path!==budgetPath),additions=['src/lib/organization-resource-usage-policy.mjs','src/lib/organization-resource-usage-store.mjs','src/lib/plan-baseline-policy.mjs','src/lib/plan-import-document-curve.mjs','src/lib/plan-measurement-policy.mjs','src/lib/plan-measurement-source.mjs'];
            assert.equal(historical.length,51,'The complete historical closure remains fifty-one paths');
            assert.ok(additions.every(file=>historical.some(ref=>ref.path===file)),'Every one of the six original additions remains required');
            const previousPaths=historical.map(ref=>ref.path).filter(file=>!additions.includes(file));assert.equal(previousPaths.length,45);
            assert.equal(hash(JSON.stringify(previousPaths)),'7b80374f19fbef78313555d34f04ebe46d415a0005e60cb2feed08079896bdb1');
            const source=manifest.find(ref=>ref.path===budgetPath);
            return {version:'company-usage-proxy-budget-source-v1',state:'AUTHENTICATED_SOURCE_ONLY',actualSourceCount:manifest.length,actualPathsSha256:hash(JSON.stringify(paths)),historicalSourceCount:historical.length,historicalPathsSha256:hash(JSON.stringify(historical.map(ref=>ref.path))),originalSourceCount:previousPaths.length,originalPathsSha256:hash(JSON.stringify(previousPaths)),budgetSource:{path:source.path,rawSha256:source.sha256},budgetPreviousContractSha256:authenticated.previousContractSha256};
          }
          const sourceProjection=projectCompanyUsageSources(sourceManifest,currentContract,readCommitted),budgetPath='src/lib/plan-budget-source.mjs';
          assert.throws(()=>projectCompanyUsageSources(sourceManifest.filter(ref=>ref.path!==budgetPath),currentContract,readCommitted),/The current Budget source is required before historical projection/);
          const forgedContract=structuredClone(currentContract);forgedContract.planBudgetCurrentRevision.references.find(ref=>ref.path===budgetPath).currentSha256='0'.repeat(64);
          assert.throws(()=>projectCompanyUsageSources(sourceManifest,forgedContract,readCommitted),error=>error.code==='PLAN_BUDGET_CURRENT_CI_LINEAGE_REJECTED'&&error.reason==='IMMUTABLE_COMPANION');
          const alteredBytes=Buffer.concat([readCommitted(budgetPath),Buffer.from('\n// Synthetic source substitution must fail.\n')]),alteredRead=file=>file===budgetPath?alteredBytes:readCommitted(file),resealedManifest=sourceManifest.map(ref=>ref.path===budgetPath?{...ref,sha256:hash(alteredBytes)}:ref);
          assert.throws(()=>projectCompanyUsageSources(resealedManifest,currentContract,alteredRead),error=>error.code==='PLAN_BUDGET_CURRENT_CI_LINEAGE_REJECTED'&&error.reason==='CURRENT_SOURCE_'+budgetPath);
          const sourceProjectionNegativeChecks=['omitted-current-budget-source','resealed-current-companion','resealed-source-and-raw-manifest'];
          const budgetValidationSourceManifest=[...new Set(['.github/workspace-acceptance-contract.json',...planBudgetValidationFiles(currentContract)])].sort().map(file=>{const committed=readCommitted(file);assert.deepEqual(readFileSync(file),committed);return {path:file,sha256:hash(committed)};});
          const apiRouteInventory=git('ls-files','src/app/api').split('\n').filter(file=>file.endsWith('/route.js')).sort();
          function visitRoutes(folder){return readdirSync(folder,{withFileTypes:true}).flatMap(item=>item.isDirectory()?visitRoutes(path.posix.join(folder,item.name)):item.name==='route.js'?[path.posix.join(folder,item.name)]:[]);}
          assert.deepEqual(visitRoutes('src/app/api').sort(),apiRouteInventory);
          assert.ok(apiRouteInventory.includes('src/app/api/identity/company-usage/route.js'));
          writeFileSync('.vercel/private/company-usage-proxy-ci/before.json',JSON.stringify({version:1,sourceRevision:git('rev-parse','HEAD'),sourceTree:git('rev-parse','HEAD^{tree}'),sourceManifest,apiRouteInventory,sourceProjection,sourceProjectionNegativeChecks,budgetValidationSourceManifest})+'\n');
          NODE
      - name: Real proxy, signed synthetic session and canonical mock store regressions
        run: |
          node --check src/proxy.js
          node --check tests/production-company-usage-proxy.test.mjs
          npx eslint src/proxy.js tests/production-company-usage-proxy.test.mjs --max-warnings 0
          node --test --test-reporter=tap tests/production-company-usage-proxy.test.mjs tests/production-access-boundary.test.mjs tests/production-verified-session.test.mjs tests/production-organization-usage.test.mjs > .vercel/private/company-usage-proxy-ci/tests.tap
      - name: Verify exact source and passing TAP without production acceptance
        run: |
          node --input-type=module <<'NODE'
