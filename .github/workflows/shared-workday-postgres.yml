name: Shared construction workday
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/shared-workday-postgres.yml'
      - 'scripts/verify-shared-workday-postgres.mjs'
      - 'scripts/lib/shared-workday-scenario.mjs'
      - 'scripts/lib/company-channel-disposable-fixture.mjs'
      - 'scripts/lib/disposable-postgres-cleanup.mjs'
      - 'scripts/lib/synthetic-capture-quality.mjs'
      - 'scripts/fixtures/canonical-participant-kyc.mjs'
      - 'scripts/fixtures/meta-signup-field-lifecycle-fixture.mjs'
      - 'scripts/fixtures/shared-workday-wall.jpg'
      - 'src/lib/**'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  workday:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: docker.io/library/postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: cutover_test
          POSTGRES_PASSWORD: cutover_test
          POSTGRES_DB: obrasaas_cutover_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cutover_test -d obrasaas_cutover_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CUTOVER_TEST_DISPOSABLE: '1'
      CUTOVER_TEST_DATABASE_URL: postgresql://cutover_test:cutover_test@127.0.0.1:5432/obrasaas_cutover_ci
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Exercise signed WhatsApp events and web decisions in one database
        run: node scripts/verify-shared-workday-postgres.mjs
