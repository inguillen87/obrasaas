name: Shared construction workday
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/shared-workday-postgres.yml'
      - 'scripts/verify-shared-workday-postgres.mjs'
      - 'scripts/verify-shared-workday-browser.mjs'
      - 'scripts/verify-field-task-pagination-ui.mjs'
      - 'scripts/lib/shared-workday-browser-server.mjs'
      - 'scripts/lib/owned-fixture-cleanup.mjs'
      - 'scripts/lib/field-task-request-body.mjs'
      - 'scripts/verify-company-onboarding-postgres.mjs'
      - 'scripts/lib/verify-bootstrapped-whatsapp-composition.mjs'
      - 'scripts/lib/company-contact-migration.mjs'
      - 'scripts/lib/company-channel-migration.mjs'
      - 'scripts/lib/shared-workday-scenario.mjs'
      - 'tests/shared-workday-postgres-host.test.mjs'
      - 'scripts/lib/company-channel-disposable-fixture.mjs'
      - 'scripts/lib/disposable-postgres-cleanup.mjs'
      - 'scripts/lib/synthetic-capture-quality.mjs'
      - 'scripts/fixtures/canonical-participant-kyc.mjs'
      - 'scripts/fixtures/meta-signup-field-lifecycle-fixture.mjs'
      - 'scripts/fixtures/shared-workday-wall.jpg'
      - 'src/lib/**'
      - 'src/app/(identity)/cuenta/**'
      - 'package.json'
      - 'package-lock.json'
permissions:
  contents: read
jobs:
  workday:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: docker.io/library/postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: cutover_test
          POSTGRES_PASSWORD: cutover_test
          POSTGRES_DB: obrasaas_cutover_ci
          TZ: UTC
        ports: ['127.0.0.1:6549:5432']
        options: >-
          --health-cmd "pg_isready -U cutover_test -d obrasaas_cutover_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CUTOVER_TEST_DISPOSABLE: '1'
      CUTOVER_TEST_DATABASE_URL: postgresql://cutover_test@127.0.0.1:6549/obrasaas_cutover_ci
      PGPASSWORD: cutover_test
      TZ: UTC
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/shared-workday-postgres-host.test.mjs
      - name: Approve the signed WhatsApp consumption in Chrome on the same PostgreSQL database
        env:
          WORKDAY_POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
          WORKDAY_POSTGRES_NETWORK: ${{ job.services.postgres.network }}
          PUPPETEER_EXECUTABLE_PATH: /opt/google/chrome/chrome
        run: |
          "$PUPPETEER_EXECUTABLE_PATH" --version
          node scripts/verify-shared-workday-browser.mjs > "$RUNNER_TEMP/shared-workday-browser.json"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          import {join} from 'node:path';
          const proof = JSON.parse(readFileSync(join(process.env.RUNNER_TEMP, 'shared-workday-browser.json'), 'utf8'));
          assert.equal(proof.sourceRevision, process.env.GITHUB_SHA);
          assert.equal(proof.status, 'PASS');
          console.log(JSON.stringify(proof, null, 2));
          NODE
      - name: Retain the synthetic workday receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: shared-workday-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/shared-workday-browser.json
          if-no-files-found: error
          retention-days: 7
      - name: Bootstrap a company and connect both WhatsApp number modes in UTC
        run: node scripts/verify-company-onboarding-postgres.mjs --connect-whatsapp
