name: Diagnose remaining transaction warning on disposable PostgreSQL
on:
  push:
    branches: ['validation/execution-release-20260921']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: execution_fixture
          POSTGRES_PASSWORD: local_fixture_only
          POSTGRES_DB: obrasaas_execution_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U execution_fixture -d obrasaas_execution_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://execution_fixture:local_fixture_only@127.0.0.1:5432/obrasaas_execution_ci?schema=public
      DATABASE_URL_UNPOOLED: postgresql://execution_fixture:local_fixture_only@127.0.0.1:5432/obrasaas_execution_ci?schema=public
      DIRECT_URL: postgresql://execution_fixture:local_fixture_only@127.0.0.1:5432/obrasaas_execution_ci?schema=public
      EXECUTION_RELEASE_DATABASE_URL: postgresql://execution_fixture:local_fixture_only@127.0.0.1:5432/obrasaas_execution_ci?schema=public
      EXECUTION_RELEASE_DISPOSABLE: 'true'
      EXECUTION_RELEASE_PROOF_PATH: ../evidence/postgres-domain.json
    steps:
      - uses: actions/checkout@v7
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 4b6d6d05b21574bfa2469d6c6ae1a86e08444aa5
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Prepare identical isolated candidate and diagnostic hook
        working-directory: candidate
        run: |
          mkdir -p ../evidence .vercel/transaction-validation
          npm ci > ../evidence/install.log 2>&1
          test "$(git hash-object ../harness/.transaction-validation/apply.mjs)" = d089a8c05ad2162ca4ac7d8abe0c713d6adf0579
          test "$(git hash-object ../harness/.transaction-validation/trace-client.mjs)" = be5747b07ce1f2a0cb13943235c1fa0d455a5cca
          cp ../harness/.transaction-validation/apply.mjs .vercel/transaction-validation/apply.mjs
          cp ../harness/.transaction-validation/trace-client.mjs .vercel/transaction-validation/trace-client.mjs
          node .vercel/transaction-validation/apply.mjs > ../evidence/transform.log
          npx prisma migrate deploy > ../evidence/migrations.log 2>&1
      - name: Trace the unsuppressed warning without changing query outcomes
        working-directory: candidate
        shell: bash
        run: |
          NODE_OPTIONS="--trace-deprecation --import=$PWD/.vercel/transaction-validation/trace-client.mjs" npx tsx scripts/verify-execution-release-postgres.mjs > ../evidence/driver-diagnostic.log 2>&1 || { tail -n 110 ../evidence/driver-diagnostic.log; exit 1; }
      - name: Preserve diagnostic evidence only
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: execution-driver-diagnostic-${{ github.run_id }}
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
