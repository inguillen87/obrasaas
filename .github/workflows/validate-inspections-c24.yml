name: Validate Inspections C24 convergence
on:
  push:
    branches: ['operations/inspections-c24-20260926']
permissions:
  contents: read
concurrency:
  group: inspections-c24-preflight
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify exact product tree
        run: |
          mkdir -p evidence
          python3 - <<'PYCODE'
          import json,pathlib,tempfile,os,subprocess
          m=json.load(open('.inspections-c24-validation.json'))
          with tempfile.TemporaryDirectory() as t:
              env={**os.environ,'GIT_INDEX_FILE':str(pathlib.Path(t)/'index')}
              subprocess.run(['git','read-tree','HEAD'],env=env,check=True)
              subprocess.run(['git','update-index','--force-remove','--','.github/workflows/validate-inspections-c24.yml','.inspections-c24-validation.json'],env=env,check=True)
              tree=subprocess.check_output(['git','write-tree'],env=env,text=True).strip()
          assert tree==m['productTree']
          for p,sha in m['blobs'].items():assert subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip()==sha,p
          pathlib.Path('evidence/validated-tree.json').write_text(json.dumps(m,indent=2))
          subprocess.run(['git','archive','--format=tar','--output=evidence/candidate-source.tar','HEAD',*m['blobs']],check=True)
          print('Exact product tree',tree)
          PYCODE
      - name: Exact dependencies
        run: npm ci --no-audit --no-fund > evidence/install.log 2>&1 || { tail -n 80 evidence/install.log; exit 1; }
      - name: Complete suite and affected lint
        run: |
          npm test > evidence/tests.log 2>&1 || { tail -n 120 evidence/tests.log; exit 1; }
          tail -n 10 evidence/tests.log
          npx eslint src/lib/inspection-workspace-view.js src/app/dashboard/inspections/workspace.js src/app/dashboard/inspections/page.js tests/inspection-workspace-view.test.js scripts/verify-inspections-workspace-ui.mjs > evidence/lint.log 2>&1 || { cat evidence/lint.log; exit 1; }
      - name: QAQC browser and workflow contracts
        run: |
          npx playwright install --with-deps chromium > evidence/browser-install.log 2>&1
          node scripts/verify-inspections-workspace-ui.mjs > evidence/inspection-ui.log 2>&1 || { cat evidence/inspection-ui.log; exit 1; }
          node --test tests/inspection-workspace-view.test.js tests/inspection-workflow-view.test.js tests/site-inspections.test.js > evidence/inspection-contracts.log 2>&1 || { cat evidence/inspection-contracts.log; exit 1; }
          cat evidence/inspection-ui.log
      - name: Complete application build
        run: npm run build > evidence/build.log 2>&1 || { tail -n 120 evidence/build.log; exit 1; }
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: inspections-c24-${{ github.run_id }}
          path: |
            evidence/
            .vercel/inspections-workspace-ui/proof.json
            .vercel/inspections-workspace-ui/failure.json
            .vercel/inspections-workspace-ui/*.png
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
