          assert.match(process.env.SOURCE_REVISION,/^[a-f0-9]{40}$/);
          assert.notEqual(process.env.SOURCE_REVISION,'472cc6c4d97d7386d413ef882387763d2e226608','472 failed canonical64; a separately reviewed successor is required');
          assert.notEqual(process.env.SOURCE_REVISION,process.env.GITHUB_SHA,'Source must remain distinct from the Ops event');
          assert.equal(process.env.GITHUB_ACTIONS,'true');
          assert.equal(process.env.GITHUB_EVENT_NAME,'push');
