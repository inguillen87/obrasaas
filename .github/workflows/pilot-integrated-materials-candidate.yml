            candidate/.vercel/private/materials-candidate-ci/company-native-pg/${{ github.run_id }}-${{ github.run_attempt }}/
            candidate/.vercel/private/company-channel-postgres-proof.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  inventory-ui:
    name: Inventory UI FULL, four widths and exact copy provenance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
        working-directory: candidate
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://build_only:build_only@127.0.0.1:5432/build_only
      EVIDENCE_DIR: .vercel/private/materials-candidate-ci/inventory-ui/${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Reject an unreviewed or foreign source target
        working-directory: .
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "push" ]]
          [[ "$GITHUB_REF" == "refs/heads/operations/integrated-materials-own72-candidate-20261025" ]]
          [[ "$SOURCE_REVISION" =~ ^[a-f0-9]{40}$ ]]
          [[ "$SOURCE_REVISION" == "d99e14ba5279bdc0faabbd09933a9d52bdca0647" ]]
          [[ "$SOURCE_REVISION" != "472cc6c4d97d7386d413ef882387763d2e226608" ]]
          [[ "$SOURCE_REVISION" != "$GITHUB_SHA" ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: workflow-source
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_REVISION }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Record actual Ops and physical source identities before dependencies
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const git=(cwd,...a)=>execFileSync('git',a,{cwd,encoding:'utf8',maxBuffer:40*1024*1024}).trim();
          assert.equal(process.version,'v24.21.0');
          assert.match(process.env.SOURCE_REVISION,/^[a-f0-9]{40}$/);
          assert.equal(process.env.SOURCE_REVISION,'d99e14ba5279bdc0faabbd09933a9d52bdca0647','This workflow is sealed for one literal reviewed source');
          assert.notEqual(process.env.SOURCE_REVISION,'472cc6c4d97d7386d413ef882387763d2e226608','472 failed canonical64; a separately reviewed successor is required');
          assert.notEqual(process.env.SOURCE_REVISION,process.env.GITHUB_SHA,'Source must remain distinct from the Ops event');
          assert.equal(process.env.GITHUB_ACTIONS,'true');
          assert.equal(process.env.GITHUB_EVENT_NAME,'push');
          assert.equal(process.env.GITHUB_REF,'refs/heads/operations/integrated-materials-own72-candidate-20261025');
          assert.match(process.env.GITHUB_RUN_ID,/^[1-9][0-9]*$/);
          assert.match(process.env.GITHUB_RUN_ATTEMPT,/^[1-9][0-9]*$/);
          const root=process.cwd(),ops=path.resolve(root,'../workflow-source');
          assert.equal(git(root,'rev-parse','HEAD'),process.env.SOURCE_REVISION);
          assert.equal(git(ops,'rev-parse','HEAD'),process.env.GITHUB_SHA);
          assert.equal(git(root,'status','--porcelain=v1','--untracked-files=all'),'');
          assert.equal(git(ops,'status','--porcelain=v1','--untracked-files=all'),'');
          const section=JSON.parse(fs.readFileSync('.github/workspace-acceptance-contract.json')).planBudgetCurrentRevision,own=section.ownRuntimeDiagnosticAdvance;
          assert.equal(own.sourceChanges.length,72);assert.equal(own.sourceChanges.filter(r=>r.status==='MODIFIED').length,54);assert.equal(own.sourceChanges.filter(r=>r.status==='ADDED').length,18);assert.equal(own.retainedDependencies.length,5);assert.equal(section.references.length,85);assert.equal(section.sourceSetDeltas.length,22);
          const validation=[...new Set(['scripts/lib/plan-budget-current-ci-reviewed.mjs',...section.references.map(r=>r.path),...own.sourceChanges.map(r=>r.path),...own.retainedDependencies.map(r=>r.path),'src/lib/participant-admission.mjs','src/lib/procurement-quantity.js','src/lib/progress-measurement-quantity.js','src/lib/task-progress-measurement.js'])];assert.equal(validation.length,137);
          const files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean).sort();
          assert.equal(files.length,1380,'Review source-count changes before updating this workflow');
          assert.equal(files.filter(f=>/^tests\/production-[^/]+\.test\.mjs$/.test(f)).length,348);
          const manifest=files.map(file=>{const full=path.resolve(file),s=fs.lstatSync(full);assert.ok(s.isFile()&&!s.isSymbolicLink());assert.equal(fs.realpathSync(full),full);const bytes=fs.readFileSync(full);return {path:file,bytes:bytes.length,rawSha256:sha(bytes),lfSha256:sha(Buffer.from(bytes.toString('utf8').replaceAll('\r\n','\n')))};});
          const folder=process.env.EVIDENCE_DIR;fs.mkdirSync(folder,{recursive:true});
          fs.writeFileSync(path.join(folder,'sources-before.json'),JSON.stringify(manifest,null,2)+'\n',{flag:'wx'});
          const workflowPath='.github/workflows/pilot-integrated-materials-candidate.yml';
          const context={version:1,sourceHead:process.env.SOURCE_REVISION,sourceTree:git(root,'rev-parse','HEAD^{tree}'),opsEventHead:process.env.GITHUB_SHA,workflowHead:process.env.GITHUB_WORKFLOW_SHA||null,workflowRef:process.env.GITHUB_WORKFLOW_REF,workflowSha256:sha(fs.readFileSync(path.join(ops,workflowPath))),runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,job:process.env.GITHUB_JOB,physicalTrackedFiles:files.length,productionTestFiles:348,ownSourceChanges:72,ownModifiedSources:54,ownAddedSources:18,ownRetainedDependencies:5,boundedValidationFiles:137,authority:'physical checked-out source, no projected source reader',limits:{production:false,realProvider:false,realClerk:false,humanAcceptance:false}};
          fs.writeFileSync(path.join(folder,'context.json'),JSON.stringify(context,null,2)+'\n',{flag:'wx'});
          console.log(JSON.stringify(context));
          NODE
      - name: Install only the source lockfile dependencies
        run: npm ci --no-audit --no-fund
      - name: Execute every original Inventory UI scenario without FOCUS
        run: |
          set -euo pipefail
          test -z "${MATERIAL_INVENTORY_UI_FOCUS+x}"
          node scripts/verify-material-inventory-ui.mjs 2>&1 | tee "$EVIDENCE_DIR/inventory-ui.original.log"
      - name: Verify all 108 scenarios and six original copies with three exact relocations
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          const sha=b=>createHash('sha256').update(b).digest('hex'),read=file=>fs.readFileSync(file);
          const checkManifest=rows=>{assert.ok(Array.isArray(rows)&&rows.length>0);assert.equal(new Set(rows.map(r=>r.path)).size,rows.length);for(const row of rows){assert.ok(typeof row.path==='string'&&!path.isAbsolute(row.path)&&!row.path.split('/').includes('..'));assert.equal(sha(read(row.path)),row.sha256,row.path);}};
          const p=JSON.parse(read('.vercel/material-inventory-evidence/browser.json')),copy=JSON.parse(read('.vercel/material-inventory-evidence/execution-fixture-sources.json'));
          assert.equal(p.status,'PASS');assert.equal(p.focus,null);assert.deepEqual(p.widths,[320,390,768,1280]);assert.equal(p.providerCalls,0);assert.equal(p.productionDataTouched,false);assert.equal(p.humanAccepted,false);checkManifest(p.sourceManifest);
          const modes=["normal","uncertain","invalid-result","catalog-conflict","catalog-reconsult-failure","missing-session","denial","pagination","consumption-pages","post-denial-close","post-denial-reload","stock-opening","stock-count","stock-receipt","stock-reject","stock-pages","consumption-context","consumption-context-legacy","queue-default","queue-filter","queue-draft-navigation","queue-attempt-navigation","queue-directed","queue-stale-counts","queue-anchor-change","queue-other-kind-change","queue-head-replacement"],expected=[320,390,768,1280].flatMap(width=>modes.map(mode=>({width,mode})));
          assert.equal(p.checkCount,108);assert.equal(p.checks.length,108);assert.deepEqual(p.checks.map(({width,mode})=>({width,mode})),expected);
          assert.equal(copy.acceptance,false);assert.equal(copy.applicationSourceChanged,false);assert.equal(copy.copiedFiles.length,6);assert.equal(copy.fixtureTransforms.length,3);
          const account=['src/app/(identity)/cuenta/field-execution-mandate-panel.js','src/app/(identity)/cuenta/field-execution-mandate-panel.module.css','src/app/(identity)/cuenta/field-execution-view.mjs'],deps=['src/lib/procurement-quantity.js','src/lib/progress-measurement-quantity.js','src/lib/task-progress-measurement.js'];
          assert.deepEqual(copy.copiedFiles.map(r=>r.sourcePath).sort(),[...account,...deps].sort());
          for(const row of copy.copiedFiles){assert.equal(row.sourceSha256,sha(read(row.sourcePath)));assert.equal(row.fixtureRelativePath,'app/'+path.basename(row.sourcePath));assert.equal(p.sourceManifest.find(r=>r.path===row.sourcePath).sha256,row.sourceSha256);}
          const source=read(account[2]);let generated=source;
          for(const [i,dep] of deps.entries()){const before=generated,needle='../../../lib/'+path.basename(dep);assert.equal(before.toString().split(needle).length,2);generated=Buffer.from(before.toString().replace(needle,'./'+path.basename(dep)));assert.deepEqual(copy.fixtureTransforms[i],{path:account[2],kind:'FLATTENED_FIXTURE_RELATIVE_IMPORT',sourceSha256:sha(source),copiedBeforeSha256:sha(before),fixtureSha256:sha(generated),fixtureRelativePath:'app/field-execution-view.mjs',dependencySourcePath:dep,dependencyFixturePath:'app/'+path.basename(dep)});}
          assert.equal(copy.originalSourceSha256,sha(source));assert.equal(copy.generatedFixtureSha256,sha(generated));assert.notEqual(copy.generatedFixtureSha256,copy.originalSourceSha256);
          console.log(JSON.stringify({state:'PASS',scope:'FULL controlled Inventory UI',scenarios:108,widths:p.widths,exactCopies:6,exactRelocations:3,originalProofRetained:true,humanAcceptance:false}));
          NODE
      - name: Verify every tracked source remained byte-identical
        if: always()
        env:
          PRIOR_JOB_STATUS: ${{ job.status }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const folder=process.env.EVIDENCE_DIR,sha=b=>createHash('sha256').update(b).digest('hex');
          let failure=null;
          try {
           const before=JSON.parse(fs.readFileSync(path.join(folder,'sources-before.json')));
           const files=execFileSync('git',['ls-files','-z'],{encoding:'utf8'}).split('\0').filter(Boolean).sort();
           assert.deepEqual(files,before.map(r=>r.path));
           for(const row of before){const file=path.resolve(row.path),s=fs.lstatSync(file);assert.ok(s.isFile()&&!s.isSymbolicLink());assert.equal(fs.realpathSync(file),file);const bytes=fs.readFileSync(file);assert.equal(bytes.length,row.bytes,row.path);assert.equal(sha(bytes),row.rawSha256,row.path);}
           assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),process.env.SOURCE_REVISION);
           assert.equal(execFileSync('git',['status','--porcelain=v1','--untracked-files=all'],{encoding:'utf8'}),'');
          } catch(error){failure={message:error.message,code:error.code||null};}
          fs.mkdirSync(folder,{recursive:true});
          fs.writeFileSync(path.join(folder,'source-fence-final.json'),JSON.stringify({state:failure?'FAIL':'PASS',scope:'tracked source integrity only; consult original producer exit and job status',priorJobStatus:process.env.PRIOR_JOB_STATUS,sourceHead:process.env.SOURCE_REVISION,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,job:process.env.GITHUB_JOB,failure},null,2)+'\n');
          const outputRoots=[folder,...(process.env.GITHUB_JOB==='inventory-ui'?['.vercel/material-inventory-evidence']:process.env.GITHUB_JOB==='company-native-pg'?['.vercel/private/company-channel-postgres-proof.json']:[])],outputs=[];
          function visit(file){if(!fs.existsSync(file))return;const stat=fs.lstatSync(file);assert.ok(!stat.isSymbolicLink());if(stat.isDirectory()){for(const name of fs.readdirSync(file).sort())visit(path.join(file,name));}else{assert.ok(stat.isFile());outputs.push({path:file,bytes:stat.size,sha256:sha(fs.readFileSync(file))});}}
          outputRoots.forEach(visit);
          fs.writeFileSync(path.join(folder,'outputs-manifest.json'),JSON.stringify({sourceHead:process.env.SOURCE_REVISION,opsEventHead:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,runAttempt:process.env.GITHUB_RUN_ATTEMPT,job:process.env.GITHUB_JOB,priorJobStatus:process.env.PRIOR_JOB_STATUS,files:outputs},null,2)+'\n',{flag:'wx'});
          if(failure)throw new Error('Final physical source fence failed: '+failure.message);
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: materials-inventory-ui-${{ env.SOURCE_REVISION }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/.vercel/private/materials-candidate-ci/inventory-ui/${{ github.run_id }}-${{ github.run_attempt }}/
            candidate/.vercel/material-inventory-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
