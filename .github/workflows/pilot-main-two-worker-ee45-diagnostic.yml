name: Main ee45 serial and two-worker diagnostic only
'on':
  push:
    branches:
      - operations/main-parallel-ee45-diagnostic-20261025
    paths:
      - .github/workflows/pilot-main-two-worker-ee45-diagnostic.yml
permissions:
  contents: read
concurrency:
  group: main-ee45-diagnostic-${{ github.ref }}
  cancel-in-progress: false
jobs:
  same-source-serial-parallel:
    if: github.repository == 'inguillen87/obrasaas' && github.event_name == 'push' && github.ref == 'refs/heads/operations/main-parallel-ee45-diagnostic-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
        working-directory: candidate
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NODE_OPTIONS: ''
      NODE_PATH: ''
      SOURCE_REVISION: ee45d558c1493bf8f0efe0333653baf1a001db3e
    steps:
      - name: Exact Ops driver checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: driver
          persist-credentials: false
      - name: Literal final source checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ee45d558c1493bf8f0efe0333653baf1a001db3e
          path: candidate
          persist-credentials: false
      - name: Original diagnostic Node24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Bind real driver/source context and reviewed scripts
        run: |-
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "inguillen87/obrasaas" ]]
          [[ "$GITHUB_EVENT_NAME" == "push" ]]
          [[ "$GITHUB_REF" == "refs/heads/operations/main-parallel-ee45-diagnostic-20261025" ]]
          [[ "$SOURCE_REVISION" == "ee45d558c1493bf8f0efe0333653baf1a001db3e" && "$SOURCE_REVISION" != "$GITHUB_SHA" ]]
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import cp from 'node:child_process';import assert from 'node:assert/strict';import{createHash}from'node:crypto';import{pathToFileURL}from'node:url';
          const hash=value=>createHash('sha256').update(value).digest('hex');assert.equal(process.version,'v24.21.0');
          const bundle={"qa-common.mjs":{"sha256":"d5b95a67d1dc5f7f6f178b488507839eed254f5b010d0e1a72a284a777489c7d","base64":""},"benchmark-pair.mjs":{"sha256":"07ac9b5a26adb06b26c569049717eabbd11568117dfac789ad4f8d2aad53bacf","base64":""},"benchmark-compare.mjs":{"sha256":"25d38867e73e97f3fdbd29e508093df23aebf15d73a1a2d3abbd13ff6a77b483","base64":""}};
          const base=path.resolve('.vercel/private/main-two-worker-driver'),evidence=path.resolve('.vercel/private/main-two-worker-evidence-'+process.env.GITHUB_RUN_ID+'-'+process.env.GITHUB_RUN_ATTEMPT);assert.equal(fs.existsSync(base),false);assert.equal(fs.existsSync(evidence),false);fs.mkdirSync(base,{recursive:true});fs.mkdirSync(evidence,{recursive:true});
          for(const[name,row]of Object.entries(bundle)){const bytes=Buffer.from(row.base64,'base64');assert.equal(hash(bytes),row.sha256);fs.writeFileSync(path.join(base,name),bytes,{flag:'wx'});}
          const driver=path.resolve('../driver');const dg=(...args)=>cp.execFileSync('git',['-C',driver,...args],{encoding:'utf8',maxBuffer:40*1024*1024});const driverSnapshot=()=>{assert.equal(dg('rev-parse','HEAD').trim(),process.env.GITHUB_SHA);assert.equal(dg('status','--porcelain=v1','--untracked-files=all'),'');const files=dg('ls-files','-z').split('\0').filter(Boolean).sort(),manifest=files.map(file=>({path:file,sha256:hash(fs.readFileSync(path.join(driver,file)))}));return{head:process.env.GITHUB_SHA,tree:dg('rev-parse','HEAD^{tree}').trim(),sourceCount:files.length,manifestSha256:hash(JSON.stringify(manifest)),manifest};};
          const common=await import(pathToFileURL(path.join(base,'qa-common.mjs')));const source=common.snapshot();common.writeJson(path.join(evidence,'source.before-setup.json'),source);common.writeJson(path.join(evidence,'driver.before.json'),driverSnapshot());common.writeJson(path.join(evidence,'driver-bundle.json'),{sourceRevision:common.TARGET,run:common.context(),node:process.execPath,nodeVersion:process.version,nodeBinarySha256:hash(fs.readFileSync(process.execPath)),bundle:Object.fromEntries(Object.entries(bundle).map(([name,row])=>[name,row.sha256])),runtimeEgressInstrumented:false});
          NODE
      - name: Locked source dependencies
        run: npm ci --no-audit --no-fund
      - name: Actual source CLI equivalence before full modes
        run: |-
          set -euo pipefail
          evidence=".vercel/private/main-two-worker-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          set +e
          node .github/scripts/verify-workspace-ci-parallelization.mjs equivalence --expected-head "$SOURCE_REVISION" > "$evidence/equivalence.stdout.log" 2> "$evidence/equivalence.stderr.log"
          status=$?
          set -e
          cat "$evidence/equivalence.stdout.log"
          cat "$evidence/equivalence.stderr.log" >&2
          printf '{"exitCode":%s}\n' "$status" > "$evidence/equivalence.exit.json"
          exit "$status"
      - name: Full serial reference then full parallel exactly once
        run: |-
          set -euo pipefail
          evidence=".vercel/private/main-two-worker-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          pair=".vercel/private/main-two-worker-pair-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          set +e
          node .vercel/private/main-two-worker-driver/benchmark-pair.mjs --execute --expected-head "ee45d558c1493bf8f0efe0333653baf1a001db3e" --output "$pair" > "$evidence/pair.stdout.log" 2> "$evidence/pair.stderr.log"
          status=$?
          set -e
          cat "$evidence/pair.stdout.log"
          cat "$evidence/pair.stderr.log" >&2
          printf '{"exitCode":%s}\n' "$status" > "$evidence/pair.exit.json"
          exit "$status"
      - name: Compare complete original arrays JSON XML and IPC receipts
        if: always()
        run: |-
          set -euo pipefail
          evidence=".vercel/private/main-two-worker-evidence-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          pair=".vercel/private/main-two-worker-pair-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          set +e
          timeout --signal=TERM --kill-after=15s 15m node .vercel/private/main-two-worker-driver/benchmark-compare.mjs --execute --expected-head "ee45d558c1493bf8f0efe0333653baf1a001db3e" --output "$pair" > "$evidence/comparison.stdout.log" 2> "$evidence/comparison.stderr.log"
          status=$?
          set -e
          cat "$evidence/comparison.stdout.log"
          cat "$evidence/comparison.stderr.log" >&2
          printf '{"exitCode":%s}\n' "$status" > "$evidence/comparison.exit.json"
          exit "$status"
      - name: Final source and driver fence preserves prior failure
        if: always()
        env:
          PRIOR_JOB_STATUS: ${{ job.status }}
        run: |-
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';import path from 'node:path';import cp from 'node:child_process';import assert from 'node:assert/strict';import{createHash}from'node:crypto';import{pathToFileURL}from'node:url';const hash=value=>createHash('sha256').update(value).digest('hex');
          const base=path.resolve('.vercel/private/main-two-worker-driver'),evidence=path.resolve('.vercel/private/main-two-worker-evidence-'+process.env.GITHUB_RUN_ID+'-'+process.env.GITHUB_RUN_ATTEMPT);let failure=null,sourceAfter=null,driverAfter=null;
          const driver=path.resolve('../driver');const dg=(...args)=>cp.execFileSync('git',['-C',driver,...args],{encoding:'utf8',maxBuffer:40*1024*1024});const driverSnapshot=()=>{assert.equal(dg('rev-parse','HEAD').trim(),process.env.GITHUB_SHA);assert.equal(dg('status','--porcelain=v1','--untracked-files=all'),'');const files=dg('ls-files','-z').split('\0').filter(Boolean).sort(),manifest=files.map(file=>({path:file,sha256:hash(fs.readFileSync(path.join(driver,file)))}));return{head:process.env.GITHUB_SHA,tree:dg('rev-parse','HEAD^{tree}').trim(),sourceCount:files.length,manifestSha256:hash(JSON.stringify(manifest)),manifest};};
          try{const bundle=JSON.parse(fs.readFileSync(path.join(evidence,'driver-bundle.json')));for(const[name,pin]of Object.entries(bundle.bundle))assert.equal(hash(fs.readFileSync(path.join(base,name))),pin);const common=await import(pathToFileURL(path.join(base,'qa-common.mjs')));sourceAfter=common.snapshot();assert.deepEqual(sourceAfter,JSON.parse(fs.readFileSync(path.join(evidence,'source.before-setup.json'))));driverAfter=driverSnapshot();assert.deepEqual(driverAfter,JSON.parse(fs.readFileSync(path.join(evidence,'driver.before.json'))));}catch(error){failure={code:error.code||error.name,message:error.message};}
          if(fs.existsSync(evidence))fs.writeFileSync(path.join(evidence,'final-fence.json'),JSON.stringify({state:failure?'FAIL':'PASS_SOURCE_DRIVER_FENCE_ONLY',sourceRevision:'ee45d558c1493bf8f0efe0333653baf1a001db3e',priorJobStatus:process.env.PRIOR_JOB_STATUS,sourceAfter,driverAfter,failure,neverRelabelsEarlierFailure:true,comparisonAndProcessStatusesSeparate:true,runtimeEgressInstrumented:false},null,2)+'\n',{flag:'wx'});if(failure)process.exitCode=1;
          NODE
      - name: Retain originals and real context
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: main-two-worker-ee45-${{ github.run_id }}-${{ github.run_attempt }}
          path: |-
            candidate/.vercel/private/main-two-worker-*
            candidate/.vercel/private/selftest-workers-*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
