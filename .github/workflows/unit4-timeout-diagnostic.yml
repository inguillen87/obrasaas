# Source identity rendered from an explicit real Git commit; QA/Root approval remains separate.
name: Unit4 file lifecycle diagnostic - source SHA sealed by generator
'on':
  push:
    branches:
      - operations/unit4-timeout-observer-diagnostic-20261025
    paths:
      - .github/workflows/unit4-timeout-diagnostic.yml
      - .github/scripts/unit4-probe-observer.mjs
      - .github/scripts/unit4-probe-runner.mjs
      - .github/probes/unit4-source-bindings.json
permissions:
  contents: read
jobs:
  unit4:
    name: Unit4 probe (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode:
          - node-default
          - explicit-2
    services:
      postgres:
        image: docker.io/library/postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: cutover_test
          POSTGRES_PASSWORD: cutover_test
          POSTGRES_DB: obrasaas_cutover_ci
        ports:
          - '5432:5432'
        options: '--health-cmd "pg_isready -U cutover_test -d obrasaas_cutover_ci" --health-interval 5s --health-timeout 5s --health-retries 12'
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CUTOVER_TEST_DISPOSABLE: '1'
      CUTOVER_TEST_DATABASE_URL: postgresql://cutover_test:cutover_test@127.0.0.1:5432/obrasaas_cutover_ci
      DATABASE_URL: postgresql://build_only:build_only@127.0.0.1:5432/build_only
    steps:
      - name: Exact Ops workflow and observer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: ops
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exact reviewed source - distinct SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: inguillen87/obrasaas
          path: source
          ref: ee45d558c1493bf8f0efe0333653baf1a001db3e
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Snapshot every source and Ops tracked byte; derive exact22
        run: node "$GITHUB_WORKSPACE/ops/.github/scripts/unit4-probe-runner.mjs" prepare "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/ops"
      - name: Exact source dependencies
        working-directory: source
        run: npm ci --no-audit --no-fund
      - name: All22 unit files; live lifecycle mirror; selected concurrency
        run: node "$GITHUB_WORKSPACE/ops/.github/scripts/unit4-probe-runner.mjs" run "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/ops" "${{ matrix.mode }}"
      - name: Final source and Ops raw fences; retain partial traces
        if: always()
        run: node "$GITHUB_WORKSPACE/ops/.github/scripts/unit4-probe-runner.mjs" finalize "$GITHUB_WORKSPACE/source" "$GITHUB_WORKSPACE/ops"
      - name: Original TAP and unbuffered file lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: unit4-probe-${{ github.run_id }}-${{ matrix.mode }}
          path: source/.vercel/unit4-probe/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
    if: github.repository == 'inguillen87/obrasaas' && github.event_name == 'push' && github.ref == 'refs/heads/operations/unit4-timeout-observer-diagnostic-20261025'
concurrency:
  group: unit4-probe-${{ github.sha }}
  cancel-in-progress: false
