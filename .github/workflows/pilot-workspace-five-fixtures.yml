name: Five corrected Workspace fixtures - focal closure only
on:
  push:
    branches: ['operations/workspace-five-fixtures-20261025']
    paths:
      - '.github/workflows/pilot-workspace-five-fixtures.yml'
      - '.github/scripts/workspace-five-fixtures-driver.mjs'
      - '.github/probes/workspace-five-fixtures-bindings.json'
permissions:
  contents: read
concurrency:
  group: workspace-five-fixtures-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false
jobs:
  focal:
    if: github.repository == 'inguillen87/obrasaas' && github.event_name == 'push' && github.ref == 'refs/heads/operations/workspace-five-fixtures-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workspace-ui
            script: scripts/verify-workspace-ui.mjs
          - name: meta
            script: scripts/verify-meta-field-bridge-postgres.mjs
          - name: people
            script: scripts/verify-mobile-identity-ui.mjs
          - name: overtime
            script: scripts/verify-field-overtime-ui.mjs
          - name: plan-recovery
            script: scripts/verify-workspace-plan-recovery-ui.mjs
    name: ${{ matrix.name }}
    services:
      postgres:
        image: docker.io/library/postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: cutover_test
          POSTGRES_PASSWORD: cutover_test
          POSTGRES_DB: obrasaas_cutover_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U cutover_test -d obrasaas_cutover_ci" --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CUTOVER_TEST_DISPOSABLE: '1'
      CUTOVER_TEST_DATABASE_URL: postgresql://cutover_test:cutover_test@127.0.0.1:5432/obrasaas_cutover_ci
      DATABASE_URL: postgresql://build_only:build_only@127.0.0.1:5432/build_only
      SOURCE_SHA: 73c810d211f4e0540a130f2e989f77257bc86410
      OPS_ROOT: ${{ github.workspace }}/ops
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: ops
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: 73c810d211f4e0540a130f2e989f77257bc86410
          path: source
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Original pinned Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Exact future source and fresh focal evidence
        run: node ../ops/.github/scripts/workspace-five-fixtures-driver.mjs preflight '${{ matrix.name }}'
      - name: Execute only the original corrected fixture at its full existing scope
        run: node '${{ matrix.script }}'
      - name: Focal proof and substantive original limits
        run: node ../ops/.github/scripts/workspace-five-fixtures-driver.mjs validate '${{ matrix.name }}'
      - name: Preserve final source and Operations fences even after failure
        if: always()
        run: node ../ops/.github/scripts/workspace-five-fixtures-driver.mjs final '${{ matrix.name }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: workspace-five-fixtures-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.name }}
          path: |
            ops/.vercel/workspace-five-fixtures/
            source/.vercel/workspace-evidence/
            source/.vercel/meta-field-evidence/
            source/.vercel/mobile-identity-evidence/
            source/.vercel/private/field-overtime-ui-proof.json
            source/.vercel/private/workspace-plan-recovery-ui-validation.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
