name: Production access boundary
on:
  push:
    branches: [master, 'hotfix/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: cutover_test
          POSTGRES_PASSWORD: cutover_test
          POSTGRES_DB: obrasaas_cutover_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cutover_test -d obrasaas_cutover_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CUTOVER_TEST_DISPOSABLE: '1'
      CUTOVER_TEST_DATABASE_URL: postgresql://cutover_test:cutover_test@127.0.0.1:5432/obrasaas_cutover_ci
      DATABASE_URL: postgresql://build_only:build_only@127.0.0.1:5432/build_only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/production-*.test.mjs
      - name: Affected lint
        run: npx eslint src/lib/legacy-access-boundary.js src/lib/auth.js src/proxy.js src/app/api/state/route.js src/app/api/whatsapp/route.js src/app/api/health/route.js src/app/sign-in/page.js src/app/sign-up/page.js src/app/access-notice.js next.config.mjs scripts/verify-production-boundary.mjs tests/production-access-boundary.test.mjs tests/production-dependencies.test.mjs tests/production-cutover-audit.test.mjs scripts/lib/legacy-cutover-audit.mjs scripts/lib/read-legacy-cutover.mjs scripts/audit-legacy-cutover.mjs scripts/verify-cutover-readonly-postgres.mjs scripts/lib/legacy-mapping-plan.mjs scripts/lib/legacy-mapping-files.mjs scripts/lib/legacy-mapping-review.mjs scripts/plan-legacy-mapping.mjs scripts/verify-mapping-plan-postgres.mjs scripts/verify-mapping-review-ui.mjs tests/production-mapping-plan.test.mjs tests/helpers/legacy-mapping-fixture.mjs scripts/lib/legacy-link-policy.mjs scripts/lib/legacy-link-store.mjs scripts/lib/legacy-link-report.mjs scripts/rehearse-legacy-links.mjs scripts/verify-link-rehearsal-postgres.mjs scripts/verify-link-report-ui.mjs tests/production-link-rehearsal.test.mjs
      - name: Identity context lint
        run: npx eslint scripts/lib/identity-review-*.mjs scripts/review-legacy-identities.mjs scripts/verify-identity-context-*.mjs tests/production-identity-context.test.mjs tests/helpers/identity-context-fixture.mjs
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=low
      - run: node scripts/verify-cutover-readonly-postgres.mjs
      - run: node scripts/verify-mapping-plan-postgres.mjs
      - run: node scripts/verify-link-rehearsal-postgres.mjs
      - run: node scripts/verify-link-report-ui.mjs
      - run: node scripts/verify-identity-context-postgres.mjs
      - run: node scripts/verify-identity-context-ui.mjs
      - run: node scripts/verify-mapping-review-ui.mjs
      - run: npm run build
      - run: node scripts/verify-production-boundary.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: production-boundary-${{ github.run_id }}
          path: |
            .vercel/production-boundary-evidence/
            .vercel/cutover-audit-evidence/
            .vercel/mapping-plan-evidence/
            .vercel/link-rehearsal-evidence/
            .vercel/identity-context-evidence/
          include-hidden-files: true
          retention-days: 7
