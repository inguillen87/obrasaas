name: Production access boundary
on:
  push:
    branches: [master, 'hotfix/**', 'feat/integral-worksite-*', 'feat/pilot-readiness-*', 'feat/professional-experience-*', 'fix/whatsapp-signup-*', 'fix/clerk-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: cutover_test
          POSTGRES_PASSWORD: cutover_test
          POSTGRES_DB: obrasaas_cutover_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cutover_test -d obrasaas_cutover_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CUTOVER_TEST_DISPOSABLE: '1'
      CUTOVER_TEST_DATABASE_URL: postgresql://cutover_test:cutover_test@127.0.0.1:5432/obrasaas_cutover_ci
      DATABASE_URL: postgresql://build_only:build_only@127.0.0.1:5432/build_only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/production-*.test.mjs
      - name: Company principal separation and schema adoption lint
        run: npx eslint scripts/lib/company-contact-migration.mjs scripts/adopt-company-contact-schema.mjs tests/production-company-contact-migration.test.mjs --max-warnings 0
      - name: Affected lint
        run: npx eslint src/lib/legacy-access-boundary.js src/lib/auth.js src/proxy.js src/app/api/state/route.js src/app/api/whatsapp/route.js src/app/api/health/route.js "src/app/(identity)" src/lib/production-identity-config.mjs tests/production-domain-identity.test.mjs src/app/access-notice.js next.config.mjs scripts/verify-production-boundary.mjs tests/production-access-boundary.test.mjs tests/production-dependencies.test.mjs tests/production-cutover-audit.test.mjs scripts/lib/legacy-cutover-audit.mjs scripts/lib/read-legacy-cutover.mjs scripts/audit-legacy-cutover.mjs scripts/verify-cutover-readonly-postgres.mjs scripts/lib/legacy-mapping-plan.mjs scripts/lib/legacy-mapping-files.mjs scripts/lib/legacy-mapping-review.mjs scripts/plan-legacy-mapping.mjs scripts/verify-mapping-plan-postgres.mjs scripts/verify-mapping-review-ui.mjs tests/production-mapping-plan.test.mjs tests/helpers/legacy-mapping-fixture.mjs scripts/lib/legacy-link-policy.mjs scripts/lib/legacy-link-store.mjs scripts/lib/legacy-link-report.mjs scripts/rehearse-legacy-links.mjs scripts/verify-link-rehearsal-postgres.mjs scripts/verify-link-report-ui.mjs tests/production-link-rehearsal.test.mjs src/lib/private-image-upload.mjs src/lib/blobStorage.js src/app/api/webview/kyc/route.js tests/production-private-image-storage.test.mjs
      - name: Identity context lint
        run: npx eslint scripts/lib/identity-review-*.mjs scripts/review-legacy-identities.mjs scripts/verify-identity-context-*.mjs tests/production-identity-context.test.mjs tests/helpers/identity-context-fixture.mjs
      - name: Production verification lint
        run: npx eslint scripts/lib/production-storage-check.mjs scripts/lib/production-identity-check.mjs scripts/lib/clerk-access-build-gate.mjs scripts/verify-clerk-access-readonly.mjs scripts/verify-private-storage-live.mjs tests/production-storage-live-check.test.mjs tests/production-identity-provider-check.test.mjs tests/production-clerk-access-build-gate.test.mjs
      - name: Brand v3 integration lint
        run: npx eslint src/app/brand src/lib/brand-assets.mjs src/app/layout.js src/app/page.js tests/production-brand-v3.test.mjs scripts/verify-brand-v3-browser.mjs scripts/verify-access-contrast.mjs
      - name: Pilot media and KYC lint
        run: npx eslint src/lib/pilot-media.mjs src/lib/kyc-pilot-boundary.mjs src/lib/aiVision.js src/app/api/webview/kyc/route.js src/app/api/whatsapp/route.js tests/production-pilot-media.test.mjs scripts/verify-pilot-media-live.mjs
      - name: Plan import source and opt-in provider check lint
        run: npx eslint src/lib/plan-import-*.mjs src/app/api/identity/plan-import scripts/lib/plan-import-live-check.mjs scripts/verify-plan-import-*.mjs scripts/fixtures/generate-plan-import-fixtures.mjs tests/production-plan-import*.test.mjs --max-warnings 0
      - name: Canonical material inventory and consumption lint
        run: npx eslint src/lib/material-inventory.mjs scripts/verify-material-inventory-*.mjs tests/production-material-inventory.test.mjs --max-warnings 0
      - name: Guided demo lint
        run: npx eslint src/app/demo src/app/page.js tests/production-guided-demo.test.mjs scripts/verify-guided-demo.mjs scripts/verify-demo-company-ui.mjs
      - name: Signed session verification lint
        run: npx eslint src/lib/verified-session.mjs src/app/api/identity/session/route.js tests/production-verified-session.test.mjs
      - name: Real Meta test-number transport lint
        run: npx eslint src/lib/meta-test-recipient-binding.mjs tests/production-meta-recipient-binding.test.mjs src/lib/meta-channel-binding.mjs tests/production-meta-channel-binding.test.mjs src/lib/meta-whatsapp-transport.mjs src/lib/meta-test-dispatch.mjs src/lib/meta-webhook-scope.mjs src/lib/whatsappNotifications.js src/app/api/v1/whatsapp/dispatch/route.js src/app/api/whatsapp/route.js scripts/lib/meta-test-number-check.mjs scripts/verify-meta-test-number.mjs tests/production-meta-test-transport.test.mjs
      - name: Runtime dependency audit
        run: npm audit --omit=dev --audit-level=low
      - run: node scripts/verify-cutover-readonly-postgres.mjs
      - run: node scripts/verify-mapping-plan-postgres.mjs
      - run: node scripts/verify-link-rehearsal-postgres.mjs
      - run: node scripts/verify-link-report-ui.mjs
      - run: node scripts/verify-identity-context-postgres.mjs
      - run: node scripts/verify-identity-context-ui.mjs
      - run: node scripts/verify-mapping-review-ui.mjs
      - run: npm run build
      - run: node scripts/verify-production-boundary.mjs
      - run: node scripts/verify-brand-v3-browser.mjs
      - run: node scripts/verify-access-contrast.mjs
      - run: node scripts/verify-guided-demo.mjs
      - name: Public example company, canonical schedule and CRM navigation
        run: node scripts/verify-demo-company-ui.mjs
      - name: Professional landing, reduced motion and keyboard navigation
        run: |
          npx eslint src/app/page.js src/app/landing-interactions.js scripts/verify-professional-landing-ui.mjs --max-warnings 0
          node scripts/verify-professional-landing-ui.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: production-boundary-${{ github.run_id }}
          path: |
            .vercel/production-boundary-evidence/
            .vercel/cutover-audit-evidence/
            .vercel/mapping-plan-evidence/
            .vercel/link-rehearsal-evidence/
            .vercel/identity-context-evidence/
            .vercel/brand-v3-evidence/
            .vercel/access-contrast-evidence/
            .vercel/guided-demo-evidence/
            .vercel/demo-company-evidence/
            .vercel/professional-landing-evidence/
          include-hidden-files: true
          retention-days: 7
