name: Validate offline read continuity before release
on:
  push:
    branches: ['operations/flow-read-connectivity-20260924']
permissions:
  contents: read
concurrency:
  group: flow-read-connectivity-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify exact product tree before installation
        run: |
          mkdir -p evidence
          python3 - <<'PYCODE'
          import json,os,pathlib,subprocess,tempfile
          m=json.load(open('.flow-read-connectivity-validation.json'))
          with tempfile.TemporaryDirectory() as t:
              env={**os.environ,'GIT_INDEX_FILE':str(pathlib.Path(t)/'index')}
              subprocess.run(['git','read-tree','HEAD'],env=env,check=True)
              subprocess.run(['git','update-index','--force-remove','--','.github/workflows/validate-flow-read-connectivity.yml','.flow-read-connectivity-validation.json'],env=env,check=True)
              tree=subprocess.check_output(['git','write-tree'],env=env,text=True).strip()
          assert tree==m['productTree']
          for path,expected in m['blobs'].items():assert subprocess.check_output(['git','rev-parse','HEAD:'+path],text=True).strip()==expected,path
          pathlib.Path('evidence/verified-tree.json').write_text(json.dumps(m,indent=2))
          print('Verified product tree',tree)
          PYCODE
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund > evidence/install.log 2>&1 || { tail -n 60 evidence/install.log; exit 1; }
      - name: Full tests and source lint before generated browser bundles
        run: |
          npm test > evidence/tests.log 2>&1 || { tail -n 100 evidence/tests.log; exit 1; }
          tail -n 10 evidence/tests.log
          npm run lint > evidence/lint.log 2>&1 || { tail -n 80 evidence/lint.log; exit 1; }
      - name: Build on clean installed dependencies
        run: |
          npm run build > evidence/build.log 2>&1 || { tail -n 100 evidence/build.log; exit 1; }
          tail -n 12 evidence/build.log
          git diff --check
      - name: New connectivity cases and existing read write recovery circuits
        run: |
          npx playwright install --with-deps chromium > evidence/browser-install.log 2>&1
          for script in verify-flow-read-connectivity-ui verify-proactive-flow-history-ui verify-proactive-flow-reply-ui verify-proactive-flow-confirmation-ui verify-whatsapp-report-ui verify-flow-attendance-ui; do
            node "scripts/$script.mjs" > "evidence/$script.log" 2>&1 || { tail -n 90 "evidence/$script.log"; exit 1; }
            tail -n 1 "evidence/$script.log"
          done
      - name: Preserve synthetic verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: flow-read-connectivity-${{ github.run_id }}
          path: |
            evidence/
            .vercel/flow-read-connectivity-ui/proof.json
            .vercel/flow-read-connectivity-ui/*.png
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
