name: Authorized workspace acceptance
on:
  push:
    branches: [master, 'feat/integral-worksite-*', 'feat/pilot-readiness-*', 'hotfix/production-workspace-*', 'hotfix/customer-whatsapp-self-service-*', 'hotfix/new-constructor-onboarding-*', 'hotfix/field-team-journal-*', 'fix/whatsapp-signup-*', 'fix/clerk-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: cutover_test
          POSTGRES_PASSWORD: cutover_test
          POSTGRES_DB: obrasaas_cutover_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cutover_test -d obrasaas_cutover_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CUTOVER_TEST_DISPOSABLE: '1'
      CUTOVER_TEST_DATABASE_URL: postgresql://cutover_test:cutover_test@127.0.0.1:5432/obrasaas_cutover_ci
      DATABASE_URL: postgresql://build_only:build_only@127.0.0.1:5432/build_only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/production-disposable-postgres-cleanup.test.mjs tests/production-site-register.test.mjs tests/production-site-photo.test.mjs tests/production-workspace*.test.mjs tests/production-customer-whatsapp-setup.test.mjs tests/production-company-onboarding.test.mjs
      - name: Workspace lint
        run: npx eslint scripts/lib/disposable-postgres-cleanup.mjs tests/production-disposable-postgres-cleanup.test.mjs src/lib/workspace-*.mjs src/lib/verified-session.mjs src/app/api/identity/workspace/route.js tests/production-workspace*.test.mjs scripts/verify-workspace-postgres.mjs scripts/verify-company-onboarding-postgres.mjs scripts/verify-site-register-postgres.mjs scripts/verify-site-register-ui.mjs src/lib/site-register-*.mjs src/lib/site-photo-*.mjs src/app/api/identity/site-photo/route.js tests/production-site-photo.test.mjs tests/production-site-register.test.mjs src/app/api/identity/site-register/route.js scripts/verify-company-onboarding-ui.mjs scripts/verify-company-onboarding-readonly.mjs scripts/lib/company-schema-preflight.mjs tests/production-company-schema-preflight.test.mjs src/lib/company-onboarding-*.mjs src/app/api/identity/company-onboarding/route.js src/app/api/identity/task-creation/route.js tests/production-company-onboarding.test.mjs scripts/verify-workspace-ui.mjs scripts/verify-customer-whatsapp-ui.mjs scripts/lib/meta-template-catalog-check.mjs scripts/verify-meta-template-catalog.mjs tests/production-meta-template-catalog.test.mjs src/lib/customer-whatsapp-*.mjs src/lib/whatsapp/tenant-workspace-policy.js src/lib/whatsapp/project-workspace-profile.js src/app/api/identity/whatsapp-setup/route.js tests/production-customer-whatsapp-setup.test.mjs 'src/app/(identity)/cuenta'
      - run: node scripts/verify-workspace-postgres.mjs
      - run: node scripts/verify-site-register-postgres.mjs
      - run: node --test tests/production-participants.test.mjs tests/production-field-operations.test.mjs tests/production-meta-customer*.test.mjs tests/production-meta-field.test.mjs tests/production-worker-channel*.test.mjs tests/production-operations-status.test.mjs tests/production-site-purchase.test.mjs tests/production-progress-measurement-quantity.test.mjs
      - name: Integral worksite lint
        run: npx eslint src/lib/participant-*.mjs src/lib/field-*.mjs src/lib/meta-customer-*.mjs src/lib/whatsapp/template-review-policy.js src/lib/whatsapp/obra-intent-policy.js src/lib/whatsapp/field-worker-intent-policy.js src/lib/whatsapp/operational-proposal-decision-policy.js src/lib/site-purchase-*.mjs src/lib/operations-status.mjs src/lib/geo.js src/lib/procurement-*.js src/lib/progress-measurement-quantity.js src/app/api/identity/participants src/app/api/identity/participant-join src/app/api/identity/field-operations src/app/api/identity/field-media src/app/api/identity/field-qr src/app/api/identity/site-purchases src/app/api/identity/operations-status src/app/api/identity/meta-onboarding src/app/api/meta/customer-callback scripts/verify-participants-*.mjs scripts/verify-field-operations-*.mjs scripts/verify-meta-customer-*.mjs scripts/verify-site-purchase-*.mjs tests/production-participants.test.mjs tests/production-field-operations.test.mjs tests/production-meta-customer.test.mjs tests/production-site-purchase.test.mjs
      - run: node scripts/verify-participants-postgres.mjs
      - run: node scripts/verify-field-operations-postgres.mjs
      - run: node scripts/verify-meta-customer-postgres.mjs
      - name: Customer inbox pagination and operation recovery
        run: |
          npx eslint scripts/verify-customer-inbox-*.mjs tests/production-customer-inbox.test.mjs
          node --test tests/production-customer-inbox.test.mjs
          node scripts/verify-customer-inbox-postgres.mjs
      - name: Meta SDK loading and explicit recovery
        run: |
          npx eslint 'src/app/(identity)/cuenta/meta-sdk-loader.mjs' tests/production-meta-sdk-loader.test.mjs
          node --test tests/production-meta-sdk-loader.test.mjs
      - name: Channel identity and integrated field transactions
        run: |
          npx eslint src/lib/worker-channel-*.mjs src/lib/meta-field-*.mjs src/app/api/identity/worker-channel src/app/api/meta/customer-process scripts/verify-worker-channel-*.mjs scripts/verify-meta-field-*.mjs scripts/verify-meta-customer-processing-*.mjs scripts/verify-operations-status-ui.mjs tests/production-worker-channel*.test.mjs tests/production-meta-field.test.mjs tests/production-meta-customer-processing.test.mjs tests/production-operations-status.test.mjs
          node scripts/verify-worker-channel-postgres.mjs
          node scripts/verify-meta-customer-processing-postgres.mjs
          node scripts/verify-meta-field-bridge-postgres.mjs
      - name: Signup to participant field lifecycle
        run: |
          npx eslint scripts/verify-meta-signup-field-lifecycle-postgres.mjs scripts/fixtures/meta-signup-field-lifecycle-fixture.mjs tests/production-meta-signup-field-lifecycle.test.mjs
          node --test tests/production-meta-signup-field-lifecycle.test.mjs
          node scripts/verify-meta-signup-field-lifecycle-postgres.mjs
      - name: Consented manual template send and signed status recovery
        run: |
          npx eslint src/lib/meta-customer-template-send*.mjs src/lib/worker-channel-consent-policy.mjs src/app/api/identity/template-send tests/production-meta-customer-template-send.test.mjs tests/production-template-send-view.test.mjs scripts/verify-meta-customer-template-send-postgres.mjs scripts/verify-template-send-ui.mjs
          node --test tests/production-meta-customer-template-send.test.mjs tests/production-template-send-view.test.mjs
          node scripts/verify-meta-customer-template-send-postgres.mjs
          node scripts/verify-template-send-ui.mjs
      - name: Canonical constructor CRM ownership and receipt recovery
        run: |
          npx eslint src/lib/constructor-crm-*.mjs src/lib/enterprise-crm-policy.mjs src/app/api/identity/constructor-crm scripts/lib/constructor-crm-*.mjs scripts/verify-constructor-crm-*.mjs scripts/adopt-constructor-crm-schema.mjs tests/production-constructor-crm*.test.mjs
          node --test tests/production-constructor-crm*.test.mjs
          node scripts/verify-constructor-crm-adoption-postgres.mjs
          node scripts/verify-constructor-crm-postgres.mjs
          node scripts/verify-constructor-crm-ui.mjs
      - run: node scripts/verify-site-purchase-postgres.mjs
      - run: node scripts/verify-participants-ui.mjs
      - run: node scripts/verify-field-operations-ui.mjs
      - run: node scripts/verify-meta-customer-ui.mjs
      - run: node scripts/verify-worker-channel-ui.mjs
      - run: node scripts/verify-operations-status-ui.mjs
      - run: node scripts/verify-site-purchase-ui.mjs
      - run: node scripts/verify-site-register-ui.mjs
      - run: node scripts/verify-company-onboarding-postgres.mjs
      - run: node scripts/verify-workspace-ui.mjs
      - name: Full page receipt recovery and private inbox UX
        run: |
          npx eslint scripts/verify-workspace-reload-ui.mjs scripts/verify-customer-inbox-ui.mjs tests/production-workspace-recovery-journal.test.mjs
          node scripts/verify-workspace-reload-ui.mjs
          node scripts/verify-customer-inbox-ui.mjs
      - run: node scripts/verify-customer-whatsapp-ui.mjs
      - run: node scripts/verify-company-onboarding-ui.mjs
      - name: Clerk entry, invitation navigation and expired-session recovery
        run: |
          npx eslint src/lib/identity-return-path.mjs src/lib/session-recovery.mjs 'src/app/(identity)/cuenta/session-recovery.js' 'src/app/(identity)/cuenta/invitation-entry.js' 'src/app/(identity)/cuenta/workspace-session-request.mjs' scripts/verify-clerk-access-ui.mjs tests/production-identity-return-path.test.mjs tests/production-session-recovery.test.mjs tests/production-workspace-session-request.test.mjs
          node --test tests/production-identity-return-path.test.mjs tests/production-session-recovery.test.mjs tests/production-workspace-session-request.test.mjs
          node scripts/verify-clerk-access-ui.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: workspace-acceptance-${{ github.run_id }}
          path: |
            .vercel/workspace-evidence/
            .vercel/customer-whatsapp-evidence/
            .vercel/company-onboarding-evidence/
            .vercel/site-register-evidence/
            .vercel/participants-evidence/
            .vercel/field-operations-evidence/
            .vercel/meta-customer-evidence/
            .vercel/purchase-evidence/
            .vercel/worker-channel-evidence/
            .vercel/meta-field-evidence/
            .vercel/meta-signup-field-lifecycle-evidence/
            .vercel/operations-status-evidence/
            .vercel/clerk-access-evidence/
            .vercel/workspace-reload-evidence/
            .vercel/customer-inbox-evidence/
            .vercel/template-send-evidence/
            .vercel/constructor-crm-evidence/
            .vercel/constructor-crm-adoption-evidence/
          include-hidden-files: true
          retention-days: 7
