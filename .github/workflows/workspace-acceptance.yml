# CI47 overtime: preserves the 45 reviewed CI46 blocks; source anchors 61d316a.
name: Authorized workspace acceptance
"on":
  push:
    branches:
      - master
      - feat/integral-worksite-*
      - feat/pilot-readiness-*
      - feat/professional-experience-*
      - feat/local-font-*
      - hotfix/production-workspace-*
      - hotfix/customer-whatsapp-self-service-*
      - hotfix/new-constructor-onboarding-*
      - hotfix/field-team-journal-*
      - fix/whatsapp-signup-*
      - fix/clerk-*
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: cutover_test
          POSTGRES_PASSWORD: cutover_test
          POSTGRES_DB: obrasaas_cutover_ci
        ports:
          - "5432:5432"
        options: "--health-cmd \"pg_isready -U cutover_test -d obrasaas_cutover_ci\" --health-interval 5s --health-timeout 5s --health-retries 12"
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CUTOVER_TEST_DISPOSABLE: "1"
      CUTOVER_TEST_DATABASE_URL: postgresql://cutover_test:cutover_test@127.0.0.1:5432/obrasaas_cutover_ci
      DATABASE_URL: postgresql://build_only:build_only@127.0.0.1:5432/build_only
    outputs:
      provenance: ${{ steps.provenance.outputs.record }}
      artifactId: ${{ steps.evidence.outputs.artifact-id }}
      artifactDigest: ${{ steps.evidence.outputs.artifact-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - name: Verify exact source, workflow and fresh evidence
        run: node .github/scripts/verify-workspace-ci-parallelization.mjs preflight --lane contracts --expected-head "$GITHUB_SHA"
      - name: Pinned Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: CI gate helper lint and negative controls
        run: |
          npx eslint .github/scripts/verify-workspace-ci-parallelization.mjs --max-warnings 0
          node .github/scripts/verify-workspace-ci-parallelization.mjs selftest --expected-head "$GITHUB_SHA"
      - name: Private facial assistance, protocol and real public model fixtures
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m unittest discover -s tests -p test_private_biometric.py
          python scripts/verify-private-biometric-models.py
          npx eslint src/lib/private-biometric-analyzer.mjs tests/production-private-biometric.test.mjs --max-warnings 0
          node --test tests/production-private-biometric.test.mjs tests/production-biometric-boundary.test.mjs
      - run: node --test tests/production-disposable-postgres-cleanup.test.mjs tests/production-site-register.test.mjs tests/production-site-photo.test.mjs tests/production-workspace*.test.mjs tests/production-customer-whatsapp-setup.test.mjs tests/production-customer-whatsapp-view.test.mjs tests/production-company-onboarding.test.mjs
      - name: Workspace lint
        run: npx eslint scripts/lib/disposable-postgres-cleanup.mjs tests/production-disposable-postgres-cleanup.test.mjs src/lib/workspace-*.mjs src/lib/verified-session.mjs src/app/api/identity/workspace/route.js tests/production-workspace*.test.mjs scripts/verify-workspace-postgres.mjs scripts/verify-company-onboarding-postgres.mjs scripts/verify-site-register-postgres.mjs scripts/verify-site-register-ui.mjs src/lib/site-register-*.mjs src/lib/site-photo-*.mjs src/app/api/identity/site-photo/route.js tests/production-site-photo.test.mjs tests/production-site-register.test.mjs src/app/api/identity/site-register/route.js scripts/verify-company-onboarding-ui.mjs scripts/verify-company-onboarding-readonly.mjs scripts/lib/company-schema-preflight.mjs tests/production-company-schema-preflight.test.mjs src/lib/company-onboarding-*.mjs src/app/api/identity/company-onboarding/route.js src/app/api/identity/task-creation/route.js tests/production-company-onboarding.test.mjs scripts/verify-workspace-ui.mjs scripts/verify-customer-whatsapp-ui.mjs scripts/lib/meta-template-catalog-check.mjs scripts/verify-meta-template-catalog.mjs tests/production-meta-template-catalog.test.mjs src/lib/customer-whatsapp-*.mjs src/lib/whatsapp/tenant-workspace-policy.js src/lib/whatsapp/project-workspace-profile.js src/app/api/identity/whatsapp-setup/route.js tests/production-customer-whatsapp-setup.test.mjs tests/production-customer-whatsapp-view.test.mjs 'src/app/(identity)/cuenta'
      - name: Safe company contact adoption and preserved historical principals
        run: |
          npx eslint scripts/lib/company-contact-migration.mjs scripts/adopt-company-contact-schema.mjs tests/production-company-contact-migration.test.mjs --max-warnings 0
          node --test tests/production-company-contact-migration.test.mjs
      - run: node --test tests/production-participant*.test.mjs tests/production-field-*.test.mjs tests/production-meta-customer*.test.mjs tests/production-meta-field.test.mjs tests/production-meta-kyc*.test.mjs tests/production-meta-onboarding-readiness-view.test.mjs tests/production-pilot-media.test.mjs tests/production-video-frame-extractor.test.mjs tests/production-worker-channel*.test.mjs tests/production-operations-status.test.mjs tests/production-site-purchase.test.mjs tests/production-progress-measurement-quantity.test.mjs
      - run: npx eslint src/lib/pilot-media.mjs src/lib/video-frame-extractor.mjs src/lib/meta-kyc-*.mjs tests/production-meta-kyc*.test.mjs tests/production-video-frame-extractor.test.mjs tests/production-pilot-media.test.mjs --max-warnings 0
      - name: Integral worksite lint
        run: npx eslint src/lib/participant-*.mjs src/lib/field-*.mjs src/lib/meta-customer-*.mjs src/lib/whatsapp/template-review-policy.js src/lib/whatsapp/obra-intent-policy.js src/lib/whatsapp/field-worker-intent-policy.js src/lib/whatsapp/operational-proposal-decision-policy.js src/lib/site-purchase-*.mjs src/lib/operations-status.mjs src/lib/geo.js src/lib/procurement-*.js src/lib/progress-measurement-quantity.js src/app/api/identity/participants src/app/api/identity/participant-join src/app/api/identity/field-operations src/app/api/identity/field-media src/app/api/identity/field-qr src/app/api/identity/site-purchases src/app/api/identity/operations-status src/app/api/identity/meta-onboarding src/app/api/meta/customer-callback scripts/verify-participants-*.mjs scripts/verify-field-operations-*.mjs scripts/verify-meta-customer-*.mjs scripts/verify-site-purchase-*.mjs tests/production-participants.test.mjs tests/production-field-operations.test.mjs tests/production-field-qr-reprint.test.mjs tests/production-meta-customer.test.mjs tests/production-site-purchase.test.mjs
      - run: npx eslint tests/production-participant-receipt-access.test.mjs tests/production-participant-invitation-email.test.mjs tests/production-participant-kyc-replay.test.mjs tests/production-participant-join-replay.test.mjs --max-warnings 0
      - name: Meta SDK loading and explicit recovery
        run: |
          npx eslint 'src/app/(identity)/cuenta/meta-sdk-loader.mjs' tests/production-meta-sdk-loader.test.mjs
          node --test tests/production-meta-sdk-loader.test.mjs
      - name: Record bounded synthetic provenance
        id: provenance
        run: node .github/scripts/verify-workspace-ci-parallelization.mjs provenance --lane contracts --expected-head "$GITHUB_SHA"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        id: evidence
        if: always()
        with:
          name: workspace-acceptance-${{ github.run_id }}-${{ github.run_attempt }}-contracts
          path: |
            .vercel/private/biometric-real-model-proof.json
            .vercel/workspace-ci-evidence/lane-contracts.json
          include-hidden-files: true
          retention-days: 7
