name: Verify published planner Preview
on:
  push:
    branches: ['operations/planner-preview-smoke-20260923']
permissions:
  contents: read
  statuses: read
  deployments: read
jobs:
  public-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_CHANNEL: chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: f684ce092feb97f1040f6ce05e86c870a6922234
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Exact dependencies and browser
        run: |
          mkdir -p evidence
          npm ci --no-audit --no-fund > evidence/install.log 2>&1 || { tail -n 40 evidence/install.log; exit 1; }
          npx playwright install --with-deps chrome > evidence/browser-install.log 2>&1
      - name: Wait for this exact Vercel release and resolve its public URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,time,urllib.request,urllib.parse
          repo='https://api.github.com/repos/inguillen87/obrasaas/'
          sha='f684ce092feb97f1040f6ce05e86c870a6922234'
          inspection='https://vercel.com/marcelos-projects-c26aa499/obrasaas-saas/7Y31nGGB998bHJcmmm5AxnJnyyVF'
          def get(path):
              request=urllib.request.Request(repo+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(request,timeout=25) as response:return json.load(response)
          for attempt in range(30):
              statuses=get('commits/'+sha+'/status')['statuses']
              status=next((s for s in statuses if s['context']=='Vercel'),{})
              print('Provider state:',status.get('state','absent'),flush=True)
              if status.get('state') in ['failure','error']:raise SystemExit('Target deployment failed')
              if status.get('state')=='success':
                  assert status['target_url']==inspection
                  break
              time.sleep(20)
          else:raise SystemExit('Target deployment still pending')
          deployments=get('deployments?sha='+sha+'&per_page=10')
          candidate=None
          for deployment in deployments:
              if deployment['sha']!=sha or deployment.get('production_environment') or deployment.get('environment','').lower()=='production':continue
              for state in get('deployments/'+str(deployment['id'])+'/statuses'):
                  if state.get('state')=='success' and state.get('environment_url'):
                      candidate={'url':state['environment_url'],'githubDeployment':deployment['id'],'environment':deployment['environment']};break
              if candidate:break
          if candidate is None:
              candidate={'url':'https://obrasaas-saas-git-codex-saas-c3befa-marcelos-projects-c26aa499.vercel.app','githubDeployment':None,'environment':'Preview branch alias'}
          target=urllib.parse.urlsplit(candidate['url'])
          assert target.scheme=='https' and not target.username and not target.password and not target.query and not target.fragment and target.path in ('','/')
          assert target.hostname.startswith('obrasaas-saas-') and target.hostname.endswith('-marcelos-projects-c26aa499.vercel.app')
          head=get('git/ref/heads/codex/saas-recovery-20260917')['object']['sha'];assert head==sha
          report={'sha':sha,'providerInspection':inspection,'providerState':'success',**candidate,'immutableUrl':candidate['githubDeployment'] is not None and '-git-' not in target.hostname,'authenticated':False,'productionModified':False}
          pathlib.Path('evidence/deployment.json').write_text(json.dumps(report,indent=2))
          with open(os.environ['GITHUB_ENV'],'a') as output:output.write('E2E_BASE_URL='+candidate['url']+'\n')
          print(json.dumps(report),flush=True)
          PY
      - name: Public browser acceptance on deployed Preview
        run: |
          npm run test:e2e:public > evidence/public-browser.log 2>&1 || { tail -n 100 evidence/public-browser.log; exit 1; }
          tail -n 14 evidence/public-browser.log
      - name: Confirm unchanged release head after browser checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          request=urllib.request.Request('https://api.github.com/repos/inguillen87/obrasaas/git/ref/heads/codex/saas-recovery-20260917',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(request,timeout=25) as response:head=json.load(response)['object']['sha']
          report=json.load(open('evidence/deployment.json'));assert head==report['sha']
          report.update({'publicBrowserTests':2,'browserStatus':'PASS','headUnchangedAfterChecks':True})
          pathlib.Path('evidence/deployed-proof.json').write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          PY
      - name: Preserve public bounded evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: planner-preview-${{ github.run_id }}
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
