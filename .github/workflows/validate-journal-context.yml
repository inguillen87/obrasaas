name: Validate journal context before integration
on:
  push:
    branches: ['validation/journal-context-20260918']
permissions:
  contents: read
concurrency:
  group: journal-context-validation-20260918
  cancel-in-progress: false
jobs:
  validate-and-integrate:
    if: github.repository == 'inguillen87/obrasaas'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      BASE_SHA: e9b19c2bd20642a40c88d8d69c56781dc66e0f4b
      TARGET_BRANCH: codex/saas-recovery-20260917
    steps:
      - uses: actions/checkout@v4
        with:
          path: validation-tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: e9b19c2bd20642a40c88d8d69c56781dc66e0f4b
          path: app
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Apply candidate to exact clean checkout
        run: python validation-tools/validation/apply.py app
      - name: Install exact locked dependencies
        working-directory: app
        run: npm ci --no-audit --no-fund
      - name: Full unit and contract suite
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee .vercel/context-tests.log
      - name: Lint affected files
        working-directory: app
        run: npx eslint src/lib/progress-request.js src/app/dashboard/progress/progress-client.js src/app/dashboard/progress/progress-context-panel.js 'src/app/api/progress/[recordId]/route.js' tests/progress-request-context.test.js tests/progress-review-authorization.test.js scripts/verify-progress-context-ui.mjs
      - name: Install browser engine
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Real client UI with synthetic HTTP and identity
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          node scripts/verify-progress-context-ui.mjs 2>&1 | tee .vercel/context-ui.log
      - name: Compile before application commit
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee .vercel/context-build.log
          git diff --check
      - name: Integrate tested changes only if target is unchanged
        working-directory: app
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current=$(git ls-remote origin "refs/heads/$TARGET_BRANCH" | cut -f1)
          test "$current" = "$BASE_SHA" || { echo 'Target changed: no integration performed.'; exit 1; }
          python - <<'PY'
          import json, subprocess, pathlib
          paths=json.loads(pathlib.Path('.vercel/validation-files.json').read_text())
          allowed={'src/lib/progress-request.js','src/app/dashboard/progress/progress-client.js','src/app/dashboard/progress/progress-context-panel.js','src/app/dashboard/progress/progress-context-panel.module.css','src/app/api/progress/[recordId]/route.js','tests/progress-request-context.test.js','tests/progress-review-authorization.test.js','scripts/verify-progress-context-ui.mjs','docs/recovery/progress-context-validation.md'}
          if set(paths)!=allowed: raise RuntimeError('Unexpected integration paths')
          subprocess.run(['git','add','--',*paths],check=True)
          changed=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          if changed!=allowed: raise RuntimeError('Staged files differ from tested set')
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve journal context and guide recovery [skip ci]'
          git -c 'credential.helper=!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin "HEAD:refs/heads/$TARGET_BRANCH"
          git rev-parse HEAD > .vercel/integrated-commit.txt
          echo 'Application commit created after tests, browser check and build.' >> "$GITHUB_STEP_SUMMARY"
          cat .vercel/integrated-commit.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-context-verification-${{ github.run_id }}
          path: |
            app/.vercel/context-tests.log
            app/.vercel/context-ui.log
            app/.vercel/context-build.log
            app/.vercel/integrated-commit.txt
            app/.vercel/progress-context-ui/proof.json
            app/.vercel/progress-context-ui/context-390.png
            app/.vercel/progress-context-ui/context-1280.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
