name: Material consumption feedback acceptance
on:
  push:
    branches: [master, 'feat/integral-worksite-consumption-feedback-*', 'feat/integral-worksite-kyc-reply-feedback-*', 'feat/integral-worksite-included-usage-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CUTOVER_TEST_DISPOSABLE: "1"
      CUTOVER_TEST_DATABASE_URL: "postgresql://cutover_test:cutover_test@127.0.0.1:5432/obrasaas_cutover_ci"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Exact event source
        run: node --input-type=module -e "import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),process.env.GITHUB_SHA);"
      - name: Declare exact exhaustive contract shard
        env:
          CONTRACT_SHARD: ${{ matrix.shard }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {globSync,mkdirSync,writeFileSync} from 'node:fs';
          import path from 'node:path';
          import {createHash} from 'node:crypto';
          const patterns=["tests/production-material-consumption*.test.mjs","tests/production-material-inventory*.test.mjs","tests/production-company-field-operations.test.mjs","tests/production-field-*.test.mjs","tests/production-meta-field*.test.mjs","tests/production-task-daily-measurement-conversation.test.mjs"];
          const expected=["tests/production-company-field-operations.test.mjs","tests/production-field-attendance-head.test.mjs","tests/production-field-attendance-review-query.test.mjs","tests/production-field-attendance-review-view.test.mjs","tests/production-field-canonical-kyc.test.mjs","tests/production-field-consumption-evidence-catalog.test.mjs","tests/production-field-consumption-evidence-http.test.mjs","tests/production-field-consumption-evidence-picker.test.mjs","tests/production-field-execution-policy.test.mjs","tests/production-field-execution-store.test.mjs","tests/production-field-execution-view.test.mjs","tests/production-field-hours-report.canonical.test.mjs","tests/production-field-hours-report.http.test.mjs","tests/production-field-hours-report.ui.test.mjs","tests/production-field-hours-report.unit.test.mjs","tests/production-field-media-held-ui.test.mjs","tests/production-field-media-lease.test.mjs","tests/production-field-media-ownership.test.mjs","tests/production-field-media-privacy-v2.test.mjs","tests/production-field-media-projection.test.mjs","tests/production-field-media-usage.test.mjs","tests/production-field-media.test.mjs","tests/production-field-operations.test.mjs","tests/production-field-outbound-current-ci-lineage.test.mjs","tests/production-field-overtime-privacy.test.mjs","tests/production-field-overtime-recovery.test.mjs","tests/production-field-own-history-privacy.test.mjs","tests/production-field-progress-monotonic.test.mjs","tests/production-field-proposal-evidence.test.mjs","tests/production-field-qr-reader.test.mjs","tests/production-field-qr-reprint.test.mjs","tests/production-field-report-feedback.test.mjs","tests/production-field-review-pagination.test.mjs","tests/production-field-task-pagination-ci.test.mjs","tests/production-field-video-audio-processing.test.mjs","tests/production-field-video-processing.test.mjs","tests/production-material-consumption-draft-recovery.test.mjs","tests/production-material-consumption-evidence.test.mjs","tests/production-material-consumption-feedback-ci.test.mjs","tests/production-material-consumption-feedback-postgres-target.test.mjs","tests/production-material-consumption-feedback.test.mjs","tests/production-material-inventory-queue-panel.test.mjs","tests/production-material-inventory-queue-view.test.mjs","tests/production-material-inventory-review-queue.test.mjs","tests/production-material-inventory-traceability-view.test.mjs","tests/production-material-inventory.test.mjs","tests/production-meta-field-execution.test.mjs","tests/production-meta-field-outbound-disclosure.test.mjs","tests/production-meta-field-task-pagination.test.mjs","tests/production-meta-field-video-audio.test.mjs","tests/production-meta-field.test.mjs","tests/production-task-daily-measurement-conversation.test.mjs"];
          const files=[...new Set(patterns.flatMap(pattern=>globSync(pattern)).map(file=>file.split(path.sep).join('/')))].sort();
          assert.deepEqual(files,expected);
          assert.equal(files.length,52);
          assert.equal(createHash('sha256').update(JSON.stringify(files)).digest('hex'),'5f2f65936244f419be16f992a1de65ea2905c5b50118c596703afa57ff1bf73d');
          assert.equal(process.versions.node.split('.')[0],'24');
          assert.match(process.env.CONTRACT_SHARD||'',/^[1-4]$/);
          assert.match(process.env.GITHUB_SHA||'',/^[a-f0-9]{40}$/);
          const shard=Number(process.env.CONTRACT_SHARD),partitions=Array.from({length:4},(_,i)=>files.filter((_,index)=>index%4===i));
          assert.equal(new Set(partitions.flat()).size,files.length);assert.deepEqual(partitions.flat().sort(),files);
          mkdirSync('.vercel/private/contracts-shard-output',{recursive:true});
          writeFileSync('.vercel/private/contracts-shard-output/partition-'+shard+'.json',JSON.stringify({version:1,sourceRevision:process.env.GITHUB_SHA,node:process.version,shard,total:4,allFiles:files,selectedFiles:partitions[shard-1],sourceFilesSha256:'5f2f65936244f419be16f992a1de65ea2905c5b50118c596703afa57ff1bf73d',selection:'Node24 sorted file index modulo4',testsExecutedByThisPreflight:false},null,2)+'\n',{flag:'wx'});
          NODE
      - name: Own history, immutable author, stock and channel recovery contracts
        run: |
          set -o pipefail
          node --test --test-shard=${{ matrix.shard }}/4 tests/production-material-consumption*.test.mjs tests/production-material-inventory*.test.mjs tests/production-company-field-operations.test.mjs tests/production-field-*.test.mjs tests/production-meta-field*.test.mjs tests/production-task-daily-measurement-conversation.test.mjs 2>&1 | tee .vercel/private/contracts-shard-output/contracts-${{ matrix.shard }}.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: material-contract-shard-${{ github.sha }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: .vercel/private/contracts-shard-output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  verify:
    needs: contracts
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: docker.io/library/postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: cutover_test
          POSTGRES_PASSWORD: cutover_test
          POSTGRES_DB: obrasaas_cutover_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cutover_test -d obrasaas_cutover_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CUTOVER_TEST_DISPOSABLE: '1'
      CUTOVER_TEST_DATABASE_URL: postgresql://cutover_test:cutover_test@127.0.0.1:5432/obrasaas_cutover_ci
    steps:
      - name: RequireEveryShard
        env:
          UNIT_RESULT: ${{ needs.contracts.result }}
        run: test "$UNIT_RESULT" = "success"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Exact event source
        run: node --input-type=module -e "import assert from 'node:assert/strict';import {execFileSync} from 'node:child_process';assert.equal(execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),process.env.GITHUB_SHA);"
      - name: Consumption source and harness lint
        run: npx eslint src/lib/material-inventory.mjs src/lib/field-operations-store.mjs src/lib/meta-field-bridge.mjs src/lib/meta-field-conversation.mjs 'src/app/(identity)/cuenta/material-inventory-panel.js' 'src/app/(identity)/cuenta/material-inventory-view.mjs' scripts/verify-material-consumption-feedback*.mjs scripts/verify-consumption-feedback*.mjs tests/production-material-consumption*.test.mjs tests/production-material-inventory-traceability-view.test.mjs --max-warnings 0
      - name: Disposable PostgreSQL own author and durable consumption receipts
        run: node scripts/verify-material-consumption-feedback-postgres.mjs
      - name: Actual responsive components with synthetic authentication and APIs
        run: node scripts/verify-consumption-feedback-ui.mjs .vercel/private/consumption-feedback-evidence/browser.json
      - name: Require exact native and browser source, checks and cleanup
        run: node scripts/verify-consumption-feedback-ci.mjs --expected-head "$GITHUB_SHA"
      - name: Preserve exact checked-out source
        run: git diff --exit-code HEAD --
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: consumption-feedback-postgres-${{ github.sha }}-${{ github.run_attempt }}
          path: .vercel/private/material-consumption-feedback-postgres.json
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: consumption-feedback-ui-${{ github.sha }}-${{ github.run_attempt }}
          path: .vercel/private/consumption-feedback-evidence/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: consumption-feedback-ci-${{ github.sha }}-${{ github.run_attempt }}
          path: .vercel/private/consumption-feedback-ci.json
          include-hidden-files: true
          if-no-files-found: error
