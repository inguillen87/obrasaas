name: Validate certificates C26 convergence
on:
  push:
    branches: ['operations/certificates-c26-20260927']
permissions:
  contents: read
concurrency:
  group: certificates-c26-preflight
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify exact product tree
        run: |
          mkdir -p evidence
          python3 - <<'PYCODE'
          import json,pathlib,tempfile,os,subprocess
          m=json.load(open('.certificates-c26-validation.json'))
          with tempfile.TemporaryDirectory() as t:
              env={**os.environ,'GIT_INDEX_FILE':str(pathlib.Path(t)/'index')}
              subprocess.run(['git','read-tree','HEAD'],env=env,check=True)
              subprocess.run(['git','update-index','--force-remove','--','.github/workflows/validate-certificates-c26.yml','.certificates-c26-validation.json'],env=env,check=True)
              tree=subprocess.check_output(['git','write-tree'],env=env,text=True).strip()
          assert tree==m['productTree']
          for p,sha in m['blobs'].items():assert subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip()==sha,p
          pathlib.Path('evidence/validated-tree.json').write_text(json.dumps(m,indent=2))
          subprocess.run(['git','archive','--format=tar','--output=evidence/candidate-source.tar','HEAD',*m['blobs']],check=True)
          print('Exact product tree',tree)
          PYCODE
      - name: Exact dependencies
        run: npm ci --no-audit --no-fund > evidence/install.log 2>&1 || { tail -n 80 evidence/install.log; exit 1; }
      - name: Complete regression and affected lint
        run: |
          npm test > evidence/tests.log 2>&1 || { tail -n 120 evidence/tests.log; exit 1; }
          tail -n 10 evidence/tests.log
          python3 - <<'PYCODE'
          import json,subprocess
          m=json.load(open('.certificates-c26-validation.json'))
          subprocess.run(['npx','eslint',*m['lintFiles']],check=True)
          PYCODE
      - name: Certificate browser and recovery circuits
        run: |
          npx playwright install --with-deps chromium > evidence/browser-install.log 2>&1
          node scripts/verify-certificate-workspace-ui.mjs > evidence/browser.log 2>&1 || { tail -n 100 evidence/browser.log; exit 1; }
          tail -n 1 evidence/browser.log
      - name: Complete standard application build
        run: npm run build > evidence/build.log 2>&1 || { tail -n 120 evidence/build.log; exit 1; }
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: certificates-c26-${{ github.run_id }}
          path: |
            evidence/
            .vercel/certificate-workspace-ui/proof.json
            .vercel/certificate-workspace-ui/failure.json
            .vercel/certificate-workspace-ui/*.png
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
