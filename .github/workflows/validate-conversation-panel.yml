name: Validate separate conversation follow-up before release
on:
  push:
    branches: ['operations/conversation-followup-20260925']
permissions:
  contents: read
concurrency:
  group: conversation-followup-preflight
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify product tree and preserve exact source
        run: |
          mkdir -p evidence
          python3 - <<'PYCODE'
          import json,pathlib,tempfile,os,subprocess
          m=json.load(open('.conversation-panel-validation.json'))
          with tempfile.TemporaryDirectory() as t:
              env={**os.environ,'GIT_INDEX_FILE':str(pathlib.Path(t)/'index')}
              subprocess.run(['git','read-tree','HEAD'],env=env,check=True)
              subprocess.run(['git','update-index','--force-remove','--','.github/workflows/validate-conversation-panel.yml','.conversation-panel-validation.json'],env=env,check=True)
              tree=subprocess.check_output(['git','write-tree'],env=env,text=True).strip()
          assert tree==m['productTree']
          for p,sha in m['blobs'].items():assert subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip()==sha,p
          pathlib.Path('evidence/validated-tree.json').write_text(json.dumps(m,indent=2))
          subprocess.run(['git','archive','--format=tar','--output=evidence/candidate-source.tar','HEAD',*m['blobs']],check=True)
          print('Exact product tree',tree)
          PYCODE
      - name: Exact dependencies
        run: npm ci --no-audit --no-fund > evidence/install.log 2>&1 || { tail -n 70 evidence/install.log; exit 1; }
      - name: Complete suite and affected lint
        run: |
          npm test > evidence/tests.log 2>&1 || { tail -n 100 evidence/tests.log; exit 1; }
          tail -n 10 evidence/tests.log
          python3 - <<'PYCODE'
          import json,subprocess
          files=[p for p in json.load(open('.conversation-panel-validation.json'))['blobs'] if p.endswith(('.js','.mjs'))]
          with open('evidence/lint.log','w') as f:r=subprocess.run(['npx','eslint',*files],stdout=f,stderr=subprocess.STDOUT)
          print(open('evidence/lint.log').read());raise SystemExit(r.returncode)
          PYCODE
      - name: Complete application build
        run: npm run build > evidence/build.log 2>&1 || { tail -n 100 evidence/build.log; exit 1; }
      - name: Reading tools and preserved inbox browser circuits
        run: |
          npx playwright install --with-deps chromium > evidence/browser-install.log 2>&1
          for script in verify-inbox-continuity-ui verify-proactive-flow-history-ui verify-flow-read-connectivity-ui verify-proactive-flow-reply-ui verify-flow-incident-ui verify-flow-attendance-ui verify-whatsapp-report-ui verify-proactive-flow-confirmation-ui; do
            node "scripts/$script.mjs" > "evidence/$script.log" 2>&1 || { tail -n 100 "evidence/$script.log"; exit 1; }
            tail -n 1 "evidence/$script.log"
          done
          git diff --check
      - name: Preserve synthetic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: conversation-panel-${{ github.run_id }}
          path: |
            evidence/
            .vercel/inbox-continuity-ui/proof.json
            .vercel/inbox-continuity-ui/failure.json
            .vercel/inbox-continuity-ui/followup-*.png
            .vercel/inbox-continuity-ui/failure.png
            .vercel/proactive-flow-history-ui/proof.json
            .vercel/proactive-flow-history-ui/failure.json
            .vercel/proactive-flow-history-ui/search-*.png
            .vercel/proactive-flow-history-ui/failure.png
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
