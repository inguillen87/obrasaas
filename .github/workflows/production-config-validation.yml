name: Classify locked production dependency audit
on:
  push:
    branches: ['validation/production-config-20260919']
permissions:
  contents: read
jobs:
  production-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout validated candidate
        uses: actions/checkout@v7
        with:
          ref: b47980aa948899dbb30af91a344a10b07f6bebd4
          persist-credentials: false
      - name: Use project Node version
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Audit locked runtime dependency graph without installs or changes
        shell: bash
        run: |
          mkdir -p /tmp/obrasaas-audit
          set +e
          npm audit --omit=dev --package-lock-only --json > /tmp/obrasaas-audit/production.json
          result=$?
          set -e
          echo "$result" > /tmp/obrasaas-audit/npm-exit-code.txt
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const data=JSON.parse(fs.readFileSync('/tmp/obrasaas-audit/production.json','utf8'));
          if (!data.metadata?.vulnerabilities || data.error) throw new Error('Dependency audit not confirmed');
          const summary={scope:'locked-production-dependencies-only',candidate:'b47980aa948899dbb30af91a344a10b07f6bebd4',counts:data.metadata.vulnerabilities,
            findings:Object.entries(data.vulnerabilities || {}).map(([name,value])=>({name,severity:value.severity,isDirect:value.isDirect,range:value.range,fixAvailable:value.fixAvailable,
              advisories:value.via.filter(item=>typeof item==='object').map(item=>({name:item.name,title:item.title,url:item.url,range:item.range})),viaPackages:value.via.filter(item=>typeof item==='string')}))};
          fs.writeFileSync('/tmp/obrasaas-audit/summary.json',JSON.stringify(summary,null,2));
          console.log(JSON.stringify(summary,null,2));
          if(data.metadata.vulnerabilities.high>0 || data.metadata.vulnerabilities.critical>0) process.exitCode=1;
          JS
      - name: Confirm repository unchanged
        if: always()
        run: test -z "$(git status --porcelain)"
      - name: Preserve audit classification
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-dependency-audit-${{ github.run_id }}
          path: /tmp/obrasaas-audit/
          retention-days: 7
