name: Read installed Next workspace API reference
on:
  push:
    branches: ['operations/workspace-reference-20261001']
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Installed API reference
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          const root='node_modules/next/dist/docs/01-app/03-api-reference/';
          for(const file of ['03-file-conventions/route.md','02-components/script.md','02-components/link.md']) {
            try { console.log('\nREFERENCE '+file+'\n'+readFileSync(root+file,'utf8').split('\n').slice(0,100).join('\n')); }
            catch { console.log('Reference not found: '+file); }
          }
          JS
