name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - 'codex/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  migrations:
    name: Prisma migrations on PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: obrasaas_ci
          POSTGRES_PASSWORD: obrasaas_ci
          POSTGRES_DB: obrasaas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U obrasaas_ci -d obrasaas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://obrasaas_ci:obrasaas_ci@127.0.0.1:5432/obrasaas_ci?schema=public
      DATABASE_URL_UNPOOLED: postgresql://obrasaas_ci:obrasaas_ci@127.0.0.1:5432/obrasaas_ci?schema=public
      DIRECT_URL: postgresql://obrasaas_ci:obrasaas_ci@127.0.0.1:5432/obrasaas_ci?schema=public
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Isolate attendance cutover and later migrations
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/attendance-migrations"
          attendance_cutover="20260723150000_attendance_status_expired_enum"
          if [[ ! -d "prisma/migrations/$attendance_cutover" ]]; then
            echo "Missing attendance cutover migration: $attendance_cutover" >&2
            exit 1
          fi
          shopt -s nullglob
          for migration in prisma/migrations/*/; do
            migration_name="$(basename "$migration")"
            [[ "$migration_name" < "$attendance_cutover" ]] && continue
            mv "$migration" "$RUNNER_TEMP/attendance-migrations/"
          done

      - name: Rebuild legacy schema from migration history
        run: npm run db:migrate:deploy

      - name: Seed representative legacy attendance rows
        run: npm run seed:attendance-migration-fixtures

      - name: Restore attendance cutover and later migrations
        shell: bash
        run: |
          shopt -s nullglob
          attendance_migrations=("$RUNNER_TEMP"/attendance-migrations/*/)
          if (( ${#attendance_migrations[@]} == 0 )); then
            echo "No isolated attendance or later migrations found to restore" >&2
            exit 1
          fi
          mv "${attendance_migrations[@]}" prisma/migrations/

      - name: Deploy attendance and all later contracts
        run: npm run db:migrate:deploy

      - name: Verify attendance ledger on PostgreSQL TCP
        env:
          ATTENDANCE_MIGRATION_DATABASE_URL: postgresql://obrasaas_ci:obrasaas_ci@127.0.0.1:5432/obrasaas_ci?schema=public
        run: npm run verify:attendance-migration

      - name: Verify attendance S2 contracts on PostgreSQL TCP
        env:
          ATTENDANCE_MIGRATION_DATABASE_URL: postgresql://obrasaas_ci:obrasaas_ci@127.0.0.1:5432/obrasaas_ci?schema=public
        run: npm run verify:attendance-s2-migration

      - name: Verify canonical task and WBS contracts on PostgreSQL TCP
        env:
          CANONICAL_TASKS_MIGRATION_DATABASE_URL: postgresql://obrasaas_ci:obrasaas_ci@127.0.0.1:5432/obrasaas_ci?schema=public
        run: npm run verify:canonical-tasks-migration

      - name: Verify teams, assignments and blockers on PostgreSQL TCP
        env:
          PROJECT_EXECUTION_MIGRATION_DATABASE_URL: postgresql://obrasaas_ci:obrasaas_ci@127.0.0.1:5432/obrasaas_ci?schema=public
        run: npm run verify:project-execution-migration
      - name: Verify progress journal migration
        env:
          PROGRESS_JOURNAL_MIGRATION_DATABASE_URL: postgresql://obrasaas_ci:obrasaas_ci@127.0.0.1:5432/obrasaas_ci?schema=public
          PROGRESS_JOURNAL_MIGRATION_SCHEMA: public
        run: npm run verify:progress-journal-migration
      - name: Verify notification outbox migration
        env:
          NOTIFICATION_OUTBOX_MIGRATION_DATABASE_URL: postgresql://obrasaas_ci:obrasaas_ci@127.0.0.1:5432/obrasaas_ci?schema=public
          NOTIFICATION_OUTBOX_MIGRATION_SCHEMA: public
        run: npm run verify:notification-outbox-migration
      - name: Verify notification preferences migration
        run: npm run verify:notification-preferences-migration
      - name: Verify S6 migrations
        run: npm run verify:s6-migrations

      - name: Verify worker identity and payment controls
        env:
          WORKER_IDENTITY_MIGRATION_DATABASE_URL: postgresql://obrasaas_ci:obrasaas_ci@127.0.0.1:5432/obrasaas_ci?schema=public
        run: npm run verify:worker-identity-migrations

      - name: Verify task material requirements on PostgreSQL 17
        env:
          TASK_MATERIAL_REQUIREMENTS_MIGRATION_DATABASE_URL: postgresql://obrasaas_ci:obrasaas_ci@127.0.0.1:5432/obrasaas_ci?schema=public
          TASK_MATERIAL_REQUIREMENTS_MIGRATION_SCHEMA: public
        run: npm run verify:task-material-requirements-migration

      - name: Verify task material reservations on PostgreSQL 17
        env:
          TASK_MATERIAL_RESERVATIONS_MIGRATION_DATABASE_URL: postgresql://obrasaas_ci:obrasaas_ci@127.0.0.1:5432/obrasaas_ci?schema=public
          TASK_MATERIAL_RESERVATIONS_MIGRATION_SCHEMA: public
          TASK_MATERIAL_RESERVATIONS_DISPOSABLE_CONCURRENCY: "1"
        run: npm run verify:task-material-reservations-migration

      - name: Verify quantitative progress measurements on PostgreSQL 17
        env:
          PROGRESS_MEASUREMENTS_MIGRATION_DATABASE_URL: postgresql://obrasaas_ci:obrasaas_ci@127.0.0.1:5432/obrasaas_ci?schema=public
          PROGRESS_MEASUREMENTS_MIGRATION_SCHEMA: public
          PROGRESS_MEASUREMENTS_DISPOSABLE_CONCURRENCY: "1"
        run: npm run verify:progress-measurements-migration

      - name: Verify data subject discovery on PostgreSQL 17
        env:
          DATA_SUBJECT_DISCOVERY_MIGRATION_DATABASE_URL: postgresql://obrasaas_ci:obrasaas_ci@127.0.0.1:5432/obrasaas_ci?schema=public
          DATA_SUBJECT_DISCOVERY_MIGRATION_SCHEMA: public
        run: npm run verify:data-subject-discovery-migration

      - name: Verify data subject decision control plane on PostgreSQL 17
        env:
          DATA_SUBJECT_DECISION_MIGRATION_DATABASE_URL: postgresql://obrasaas_ci:obrasaas_ci@127.0.0.1:5432/obrasaas_ci?schema=public
          DATA_SUBJECT_DECISION_MIGRATION_SCHEMA: public
          DATA_SUBJECT_DECISION_DISPOSABLE_CONCURRENCY: "1"
        run: npm run verify:data-subject-decision-migration

      - name: Verify migration history status
        run: npx prisma migrate status

      - name: Detect schema drift
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  quality:
    name: Tests, lint, build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and contract tests
        run: npm test

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Production build
        run: npm run build

  public-e2e:
    name: Public browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public E2E
        run: npm run test:e2e:public

      - name: Preserve Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-public-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
