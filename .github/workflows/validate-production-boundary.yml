name: Validate production boundary exact tree
on:
  push:
    branches: ['operations/production-boundary-20260928']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://build_only:build_only@127.0.0.1:5432/build_only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Exact source manifest
        run: |
          python3 - <<'PYCODE'
          import json,subprocess,os,tempfile,pathlib
          m=json.load(open('.production-boundary-validation.json'))
          with tempfile.TemporaryDirectory() as t:
              env={**os.environ,'GIT_INDEX_FILE':str(pathlib.Path(t)/'index')}
              subprocess.run(['git','read-tree','HEAD'],env=env,check=True)
              subprocess.run(['git','update-index','--force-remove','--','.github/workflows/validate-production-boundary.yml','.production-boundary-validation.json'],env=env,check=True)
              tree=subprocess.check_output(['git','write-tree'],env=env,text=True).strip()
          assert tree==m['productTree']
          for p,sha in m['blobs'].items():assert subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip()==sha,p
          print('PRODUCT_TREE='+tree)
          PYCODE
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/production-access-boundary.test.mjs
      - name: Affected lint
        run: npx eslint src/lib/legacy-access-boundary.js src/lib/auth.js src/proxy.js src/app/api/state/route.js src/app/api/whatsapp/route.js src/app/api/health/route.js src/app/sign-in/page.js src/app/sign-up/page.js src/app/access-notice.js next.config.mjs scripts/verify-production-boundary.mjs tests/production-access-boundary.test.mjs
      - run: npm run build
      - run: node scripts/verify-production-boundary.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: production-boundary-${{ github.run_id }}
          path: .vercel/production-boundary-evidence/
          include-hidden-files: true
          retention-days: 7
