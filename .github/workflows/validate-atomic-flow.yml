name: Validate atomic Flow persistence before release
on:
  push:
    branches: ['operations/atomic-flow-20260925']
permissions:
  contents: read
concurrency:
  group: atomic-flow-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: execution_fixture
          POSTGRES_PASSWORD: local_fixture_only
          POSTGRES_DB: obrasaas_execution_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U execution_fixture -d obrasaas_execution_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://execution_fixture:local_fixture_only@127.0.0.1:5432/obrasaas_execution_ci?schema=public
      DATABASE_URL_UNPOOLED: postgresql://execution_fixture:local_fixture_only@127.0.0.1:5432/obrasaas_execution_ci?schema=public
      DIRECT_URL: postgresql://execution_fixture:local_fixture_only@127.0.0.1:5432/obrasaas_execution_ci?schema=public
      EXECUTION_RELEASE_DATABASE_URL: postgresql://execution_fixture:local_fixture_only@127.0.0.1:5432/obrasaas_execution_ci?schema=public
      EXECUTION_RELEASE_DISPOSABLE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify exact product tree and preserve source
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json,pathlib,tempfile,os,subprocess
          m=json.load(open('.atomic-flow-validation.json'))
          with tempfile.TemporaryDirectory() as t:
              env={**os.environ,'GIT_INDEX_FILE':str(pathlib.Path(t)/'index')}
              subprocess.run(['git','read-tree','HEAD'],env=env,check=True)
              subprocess.run(['git','update-index','--force-remove','--','.github/workflows/validate-atomic-flow.yml','.atomic-flow-validation.json'],env=env,check=True)
              tree=subprocess.check_output(['git','write-tree'],env=env,text=True).strip()
          assert tree==m['productTree']
          for p,s in m['blobs'].items():assert subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip()==s
          pathlib.Path('evidence/validated-tree.json').write_text(json.dumps(m,indent=2))
          subprocess.run(['git','archive','--format=tar','--output=evidence/candidate-source.tar','HEAD',*m['blobs']],check=True)
          print('Verified product tree',tree)
          PY
      - name: Exact dependencies
        run: npm ci --no-audit --no-fund > evidence/install.log 2>&1 || { tail -n 60 evidence/install.log; exit 1; }
      - name: Unit contracts and changed-file lint
        run: |
          npm test > evidence/tests.log 2>&1 || { tail -n 100 evidence/tests.log; exit 1; }
          tail -n 10 evidence/tests.log
          npx eslint scripts/verify-webhook-flow-atomic-postgres.mjs tests/webhook-flow-atomic-bootstrap.test.js > evidence/lint.log 2>&1 || { cat evidence/lint.log; exit 1; }
      - name: Atomic persistence on disposable PostgreSQL
        run: |
          npx prisma validate > evidence/schema.log 2>&1
          npx prisma migrate deploy > evidence/migrations.log 2>&1
          npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code > evidence/schema-diff.log 2>&1
          npx tsx scripts/verify-webhook-flow-atomic-postgres.mjs > evidence/postgres.log 2>&1 || { cat evidence/postgres.log; exit 1; }
          cat evidence/postgres.log
      - name: Complete application build
        run: |
          npm run build > evidence/build.log 2>&1 || { tail -n 80 evidence/build.log; exit 1; }
          git diff --check
      - name: Preserve synthetic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atomic-flow-${{ github.run_id }}
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
